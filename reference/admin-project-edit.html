<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>byteleaf admin — Add project</title>
<!-- REFERENCE BUILD generated from design/AdminProjectEdit.dc.html. Not production code. -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#F4F7FB}
.bl{font-family:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;color:#0B1220;-webkit-font-smoothing:antialiased}
.mono{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
a{color:#166FE5;text-decoration:none}a:hover{color:#0B4FB3}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.btn{font:inherit;cursor:pointer;border:0;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;font-weight:600;font-size:15px;white-space:nowrap;transition:transform .2s,box-shadow .2s,background .2s,border-color .2s,color .2s}
.btn-primary{background:#166FE5;color:#FFFFFF}
.btn-primary:hover{background:#0F5FCC;color:#FFFFFF;box-shadow:0 10px 24px -10px rgba(22,111,229,.7)}
.btn-ghost{background:#FFFFFF;color:#0B1220;border:1px solid #D5DEEB}
.btn-ghost:hover{border-color:#166FE5;color:#166FE5}
.snav{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:12px;color:#B7C3D9;font-size:15px;font-weight:500;white-space:nowrap;transition:background .2s,color .2s}
.snav:hover{background:#101E3A;color:#FFFFFF}
.snav.on{background:#166FE5;color:#FFFFFF}
.panel{background:#FFFFFF;border:1px solid #E3E9F2;border-radius:18px}
.field{font:inherit;font-size:15px;color:#0B1220;width:100%;box-sizing:border-box;min-height:46px;padding:11px 14px;border:1px solid #D5DEEB;border-radius:12px;background:#FFFFFF;transition:border-color .2s,box-shadow .2s}
.field:hover{border-color:#A9B8CF}
.field:focus{outline:none;border-color:#166FE5;box-shadow:0 0 0 4px rgba(24,119,242,.15)}
.field::placeholder{color:#6B7891}
.lbl{font-size:14px;font-weight:500;color:#33405A}
.hint{font-size:13px;color:#4B5872}
.chip{font:inherit;cursor:pointer;min-height:40px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:500;transition:all .2s}
.chip:hover{transform:translateY(-1px)}
.tagx{font:inherit;cursor:pointer;width:24px;height:24px;border:0;border-radius:6px;background:transparent;color:#0B4FB3;display:grid;place-items:center}
.tagx:hover{background:#D6E5FC}
.drop{transition:border-color .2s,background .2s}
.drop:hover{border-color:#166FE5;background:#F3F8FF}
.sw{font:inherit;cursor:pointer;position:relative;flex:none;width:44px;height:26px;border-radius:999px;border:0;padding:0;transition:background .2s}
.sw .knob{position:absolute;top:3px;width:20px;height:20px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(11,18,32,.3);transition:left .2s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.d1{animation-delay:.06s}.d2{animation-delay:.12s}.d3{animation-delay:.18s}.d4{animation-delay:.24s}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
.pop{animation:pop .25s cubic-bezier(.2,.8,.2,1) both}
@keyframes toast{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.toast{animation:toast .35s cubic-bezier(.2,.8,.2,1) both}
@media (max-width: 900px){.side{flex:1 1 100%!important;min-width:0;max-width:100%;flex-direction:row!important;flex-wrap:wrap!important;align-items:center!important;gap:10px!important;padding:12px 16px!important}.snavs{flex-direction:row!important;overflow-x:auto;width:100%;min-width:0;position:relative}.sfoot{display:none!important}.pad{padding-left:16px!important;padding-right:16px!important}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div id="root"></div>
<template id="dc-template">

<div class="bl" style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #F4F7FB">

<aside class="side" style="flex: 0 0 256px; background: #07101F; color: #FFFFFF; display: flex; flex-direction: column; gap: 28px; padding: 22px 16px; box-sizing: border-box">
<a href="admin-dashboard.html" aria-label="byteleaf admin home" style="display: flex; align-items: center; gap: 10px; color: #FFFFFF; font-weight: 700; font-size: 20px; letter-spacing: -0.04em; padding: 0 8px; min-height: 44px">
<svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#1877F2"></rect><path d="M8 24C8 14 14 8 24 8C24 18 18 24 8 24Z" fill="#FFFFFF"></path><path d="M8.5 23.5L18 14M13 19h4.5M15.5 16.5v-3.5" stroke="#1877F2" stroke-width="1.8" stroke-linecap="round" fill="none"></path><circle cx="18" cy="14" r="1.6" fill="#1877F2"></circle></svg>
<span>byteleaf</span>
<span class="mono" style="font-size: 10px; font-weight: 500; letter-spacing: 0.08em; color: #6FAEFF; border: 1px solid #2C5BA8; border-radius: 6px; padding: 2px 6px">ADMIN</span>
</a>
<nav aria-label="Admin" class="snavs" style="display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="6">
<a class="{{n.cls}}" href="{{n.href}}" aria-current="{{n.current}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg><span style="flex: 1">{{n.label}}</span><sc-if value="{{n.badge}}" hint-placeholder-val="{{ false }}"><span class="mono" style="min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: #1877F2; color: #FFFFFF; font-size: 11px; display: grid; place-items: center; box-sizing: border-box">{{n.badge}}<span class="sr"> new</span></span></sc-if></a>
</sc-for>
</nav>
<div class="sfoot" style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
<a class="snav" href="home.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></svg>View website</a>
<div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; background: #0B1730; border: 1px solid #1C2B47">
<span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 50%; background: #1877F2; display: grid; place-items: center; font-weight: 600; flex: none">G</span>
<span style="flex: 1; display: flex; flex-direction: column; min-width: 0"><span style="font-size: 14px; font-weight: 600">Gerald</span><span style="font-size: 12px; color: #8A98B3">Administrator</span></span>
<a href="admin-login.html" aria-label="Sign out" style="color: #B7C3D9; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg></a>
</div>
</div>
</aside>

<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
<header class="pad" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 32px; background: #FFFFFF; border-bottom: 1px solid #E3E9F2">
<div style="display: flex; flex-direction: column; gap: 2px">
<a class="mono" href="admin-projects.html" style="font-size: 12px; color: #4B5872; display: inline-flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg>Projects</a>
<h1 style="margin: 0; font-size: 26px; letter-spacing: -0.03em; font-weight: 600">Add project</h1>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<button type="button" class="btn btn-ghost" onClick="{{saveDraft}}">Save draft</button>
<button type="button" class="btn btn-primary" onClick="{{publish}}">{{publishLabel}}</button>
</div>
</header>

<div class="pad" style="padding: 24px 32px 48px; box-sizing: border-box; width: 100%; max-width: 1320px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">

<form style="flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<section class="panel rise" aria-labelledby="s1" style="padding: 24px; display: flex; flex-direction: column; gap: 18px">
<h2 id="s1" style="margin: 0; font-size: 17px; font-weight: 600">Basics</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 16px">
<div style="display: flex; flex-direction: column; gap: 8px"><label for="e-name" class="lbl">Project name *</label><input id="e-name" class="field" type="text" placeholder="e.g. Online store rebuild" onInput="{{onName}}" required></div>
<div style="display: flex; flex-direction: column; gap: 8px"><label for="e-client" class="lbl">Client name</label><input id="e-client" class="field" type="text" placeholder="Shown publicly — get permission first"></div>
<div style="display: flex; flex-direction: column; gap: 8px"><label for="e-type" class="lbl">Project type</label><input id="e-type" class="field" type="text" placeholder="e.g. E-commerce storefront" onInput="{{onType}}"></div>
<div style="display: flex; flex-direction: column; gap: 8px"><label for="e-ind" class="lbl">Industry</label><select id="e-ind" class="field"><option>Retail &amp; e-commerce</option><option>Logistics</option><option>Health &amp; pharmacy</option><option>Professional services</option><option>Property</option><option>Manufacturing</option><option>Other</option></select></div>
</div>
<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<legend class="lbl" style="padding: 0; margin-bottom: 10px">Categories <span style="font-weight: 400; color: #4B5872">— used by the filter on the Projects page</span></legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="4"><button type="button" class="chip" onClick="{{c.toggle}}" aria-pressed="{{c.pressed}}" style="{{c.style}}">{{c.label}}</button></sc-for>
</div>
</fieldset>
<div style="display: flex; flex-direction: column; gap: 10px">
<label for="e-tag" class="lbl">Tech stack</label>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px; border: 1px solid #D5DEEB; border-radius: 12px; min-height: 46px; box-sizing: border-box">
<sc-for list="{{tags}}" as="t" hint-placeholder-count="2"><span class="mono pop" style="display: inline-flex; align-items: center; gap: 4px; padding: 4px 4px 4px 10px; border-radius: 8px; background: #EEF4FE; color: #0B4FB3; font-size: 13px">{{t.label}}<button type="button" class="tagx" onClick="{{t.remove}}" aria-label="Remove {{t.label}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></span></sc-for>
<input id="e-tag" type="text" placeholder="Type and press Enter…" onKeyDown="{{onTagKey}}" style="font: inherit; font-size: 15px; border: 0; outline: none; flex: 1 1 140px; min-height: 30px; color: #0B1220">
</div>
<span class="hint">Shown as small tags on the project card.</span>
</div>
</section>

<section class="panel rise d1" aria-labelledby="s2" style="padding: 24px; display: flex; flex-direction: column; gap: 18px">
<h2 id="s2" style="margin: 0; font-size: 17px; font-weight: 600">Story</h2>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; gap: 12px"><label for="e-sum" class="lbl">One-line summary</label><span class="mono" style="font-size: 12px; color: {{countColor}}">{{count}} / 140</span></div>
<textarea id="e-sum" class="field" rows="2" maxlength="140" placeholder="What you built and the outcome, in one sentence." onInput="{{onSum}}" style="resize: vertical"></textarea>
</div>
<div style="display: flex; flex-direction: column; gap: 8px"><label for="e-ch" class="lbl">The challenge</label><textarea id="e-ch" class="field" rows="3" placeholder="What wasn't working for the client before?" style="resize: vertical"></textarea></div>
<div style="display: flex; flex-direction: column; gap: 8px"><label for="e-did" class="lbl">What we did</label><textarea id="e-did" class="field" rows="3" placeholder="Design, build, integrations — in two or three lines." style="resize: vertical"></textarea></div>
<div style="display: flex; flex-direction: column; gap: 8px"><label for="e-res" class="lbl">The result</label><textarea id="e-res" class="field" rows="3" placeholder="A real, measurable outcome the client agreed to share." style="resize: vertical"></textarea></div>
</section>

<section class="panel rise d2" aria-labelledby="s3" style="padding: 24px; display: flex; flex-direction: column; gap: 18px">
<h2 id="s3" style="margin: 0; font-size: 17px; font-weight: 600">Images</h2>
<label class="drop" for="e-cover" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-height: 200px; border: 2px dashed #C9D3E3; border-radius: 16px; background: #FBFCFE; cursor: pointer; text-align: center; padding: 24px; box-sizing: border-box">
<span style="width: 52px; height: 52px; border-radius: 14px; background: #EEF4FE; color: #166FE5; display: grid; place-items: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"></path></svg></span>
<span style="font-size: 15px; font-weight: 600">Drop a cover image or <span style="color: #166FE5">browse</span></span>
<span class="hint">JPG, PNG or WebP · 1600 × 1000 px recommended</span>
<input id="e-cover" type="file" accept="image/*" class="sr">
</label>
<div style="display: flex; flex-direction: column; gap: 10px">
<span class="lbl">Gallery <span style="font-weight: 400; color: #4B5872">(optional, shown on the case study)</span></span>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px">
<span aria-hidden="true" style="aspect-ratio: 4 / 3; border-radius: 12px; background-color: #0B1220; background-image: radial-gradient(rgba(111,174,255,0.45) 1px, transparent 1px); background-size: 10px 10px"></span>
<span aria-hidden="true" style="aspect-ratio: 4 / 3; border-radius: 12px; background-color: #EEF4FE; background-image: linear-gradient(#C9DCF9 1px, transparent 1px), linear-gradient(90deg, #C9DCF9 1px, transparent 1px); background-size: 12px 12px"></span>
<label class="drop" for="e-gal" style="aspect-ratio: 4 / 3; border-radius: 12px; border: 2px dashed #C9D3E3; display: grid; place-items: center; cursor: pointer; color: #166FE5; font-size: 14px; font-weight: 500">+ Add<input id="e-gal" type="file" accept="image/*" multiple class="sr"></label>
</div>
</div>
</section>

<section class="panel rise d3" aria-labelledby="s4" style="padding: 24px; display: flex; flex-direction: column; gap: 18px">
<h2 id="s4" style="margin: 0; font-size: 17px; font-weight: 600">Search &amp; sharing</h2>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="e-slug" class="lbl">Page address</label>
<div style="display: flex; align-items: stretch; border: 1px solid #D5DEEB; border-radius: 12px; overflow: hidden">
<span class="mono" style="display: flex; align-items: center; padding: 0 12px; background: #F4F7FB; font-size: 13px; color: #4B5872; white-space: nowrap; border-right: 1px solid #D5DEEB">/projects/</span>
<input id="e-slug" class="mono" type="text" value="{{slug}}" readonly style="font-size: 14px; border: 0; outline: none; flex: 1; min-width: 0; padding: 0 12px; min-height: 44px; color: #0B1220; background: #FFFFFF">
</div>
<span class="hint">Created automatically from the project name.</span>
</div>
</section>
</form>

<aside style="flex: 1 1 320px; min-width: 0; max-width: 100%; display: flex; flex-direction: column; gap: 20px">
<section class="panel rise d1" aria-labelledby="pub" style="padding: 22px; display: flex; flex-direction: column; gap: 16px">
<h2 id="pub" style="margin: 0; font-size: 17px; font-weight: 600">Publishing</h2>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span style="display: flex; flex-direction: column; gap: 2px"><span id="lv" style="font-size: 15px; font-weight: 500">Show on website</span><span class="hint">{{liveHint}}</span></span>
<button type="button" class="sw" role="switch" aria-checked="{{liveAria}}" aria-labelledby="lv" onClick="{{toggleLive}}" style="background: {{liveBg}}"><span class="knob" style="left: {{liveKnob}}"></span></button>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 14px; border-top: 1px solid #EEF2F8">
<span style="display: flex; flex-direction: column; gap: 2px"><span id="ft" style="font-size: 15px; font-weight: 500">Featured project</span><span class="hint">Replaces the current featured project</span></span>
<button type="button" class="sw" role="switch" aria-checked="{{featAria}}" aria-labelledby="ft" onClick="{{toggleFeat}}" style="background: {{featBg}}"><span class="knob" style="left: {{featKnob}}"></span></button>
</div>
</section>

<section class="panel rise d2" aria-labelledby="prev" style="padding: 22px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: center"><h2 id="prev" style="margin: 0; font-size: 17px; font-weight: 600">Card preview</h2><span class="mono" style="font-size: 11px; color: #4B5872">LIVE</span></div>
<article style="border: 1px solid #E3E9F2; border-radius: 18px; overflow: hidden; background: #FFFFFF">
<div aria-hidden="true" style="height: 150px; background-color: #1877F2; background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.09) 0 2px, transparent 2px 18px); display: grid; place-items: center"><span class="mono" style="font-size: 12px; color: #FFFFFF; border: 1px dashed rgba(255,255,255,0.7); padding: 6px 10px; border-radius: 8px">COVER IMAGE</span></div>
<div style="padding: 18px; display: flex; flex-direction: column; gap: 8px">
<span class="mono" style="font-size: 11px; color: #4B5872">{{pType}}</span>
<span style="font-size: 18px; font-weight: 600; letter-spacing: -0.02em">{{pName}}</span>
<span style="font-size: 14px; line-height: 1.55; color: #4B5872">{{pSum}}</span>
<span class="mono" style="display: flex; flex-wrap: wrap; gap: 6px; font-size: 11px; color: #0B4FB3; padding-top: 4px"><sc-for list="{{tags}}" as="t" hint-placeholder-count="2"><span style="padding: 3px 8px; background: #EEF4FE; border-radius: 6px">{{t.label}}</span></sc-for></span>
</div>
</article>
</section>
</aside>
</div>
</main>

<sc-if value="{{toast}}" hint-placeholder-val="{{ false }}">
<div role="status" class="toast" style="position: fixed; right: 24px; bottom: 24px; z-index: 50; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px; background: #0B1220; color: #FFFFFF; font-size: 14px; box-shadow: 0 24px 48px -16px rgba(11,18,32,0.5); max-width: calc(100% - 48px)">
<span style="width: 24px; height: 24px; border-radius: 50%; background: #0B7A55; display: grid; place-items: center; flex: none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></span>
<span>{{toast}}</span>
<a href="admin-projects.html" style="color: #6FAEFF; font-weight: 600">All projects</a>
</div>
</sc-if>
</div>
</template>

<script>
class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(p) { Object.assign(this.state, typeof p === 'function' ? p(this.state) : p); window.__render(); }
  forceUpdate() { window.__render(); }
}
</script>
<script>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { name: '', type: '', sum: '', cats: ['Frontend'], tags: ['Next.js', 'Node.js'], live: true, featured: false, toast: '' };
}
renderVals() {
const NAV = [
['dashboard', 'Dashboard', 'AdminDashboard.dc.html', 'M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z'],
['bookings', 'Bookings', 'AdminBookings.dc.html', 'M3 5h18v16H3zM3 10h18M8 3v4M16 3v4'],
['messages', 'Messages', 'AdminMessages.dc.html', 'M22 12h-6l-2 3h-4l-2-3H2M5.5 5h13L22 12v7H2v-7z'],
['billing', 'Quotes & invoices', 'AdminBilling.dc.html', 'M6 2h12v20l-3-2-3 2-3-2-3 2zM9 7h6M9 11h6M9 15h4'],
['projects', 'Projects', 'AdminProjects.dc.html', 'M12 2l10 5-10 5L2 7zM2 17l10 5 10-5M2 12l10 5 10-5'],
['settings', 'Settings', 'AdminSettings.dc.html', 'M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6']
];
const st = this.state;
const sw = (on) => ({ bg: on ? '#166FE5' : '#C9D3E3', knob: on ? '21px' : '3px', aria: on ? 'true' : 'false' });
const L = sw(st.live), F = sw(st.featured);
const slug = (st.name || 'new-project').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'new-project';
return {
nav: NAV.map((n) => ({ cls: n[0] === 'projects' ? 'snav on' : 'snav', label: n[1], href: n[2], icon: n[3], current: n[0] === 'projects' ? 'page' : 'false', badge: n[0] === 'bookings' ? '2' : n[0] === 'messages' ? '3' : '' })),
onName: (e) => this.setState({ name: e.target.value }),
onType: (e) => this.setState({ type: e.target.value }),
onSum: (e) => this.setState({ sum: e.target.value }),
count: String(st.sum.length),
countColor: st.sum.length > 120 ? '#9A5B00' : '#4B5872',
cats: ['Design', 'Frontend', 'Backend', 'AI'].map((c) => {
const on = st.cats.indexOf(c) > -1;
return { label: c, pressed: on ? 'true' : 'false', style: on ? 'border: 1px solid #166FE5; background: #166FE5; color: #FFFFFF;' : 'border: 1px solid #D5DEEB; background: #FFFFFF; color: #33405A;', toggle: () => this.setState({ cats: on ? st.cats.filter((x) => x !== c) : st.cats.concat([c]) }) };
}),
tags: st.tags.map((t) => ({ label: t, remove: () => this.setState({ tags: st.tags.filter((x) => x !== t) }) })),
onTagKey: (e) => {
if (e.key === 'Enter' || e.key === ',') {
e.preventDefault();
const v = e.target.value.trim().replace(/,$/, '');
if (v && st.tags.indexOf(v) < 0) this.setState({ tags: st.tags.concat([v]) });
e.target.value = '';
}
},
slug: slug,
liveBg: L.bg, liveKnob: L.knob, liveAria: L.aria,
featBg: F.bg, featKnob: F.knob, featAria: F.aria,
liveHint: st.live ? 'Visible to visitors once saved' : 'Hidden — only you can see it',
toggleLive: () => this.setState({ live: !st.live }),
toggleFeat: () => this.setState({ featured: !st.featured }),
publishLabel: st.live ? 'Publish project' : 'Save project',
pName: st.name || 'Project name',
pType: st.type || 'Project type',
pSum: st.sum || 'Your one-line summary appears here as you type.',
saveDraft: () => this.setState({ live: false, toast: 'Draft saved — hidden from the website.' }),
publish: () => this.setState({ toast: st.live ? (st.name || 'Project') + ' is live on the website.' : 'Project saved.' }),
toast: st.toast
};
}
}
</script>
<script>
(function () {
  const tpl = document.getElementById('dc-template');
  const root = document.getElementById('root');
  const qp = {}; new URLSearchParams(location.search).forEach((v, k) => { qp[k] = v === 'true' ? true : v === 'false' ? false : v; }); const comp = new Component(qp);
  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  function look(scope, expr) {
    expr = expr.trim();
    if (expr === 'true') return true;
    if (expr === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(expr)) return Number(expr);
    let v = scope;
    for (const k of expr.split('.')) { if (v == null) return undefined; v = v[k]; }
    return v;
  }
  function str(v) { return v == null ? '' : String(v); }
  function walk(node, scope, out) {
    if (node.nodeType === 3) {
      out.appendChild(document.createTextNode(node.nodeValue.replace(HOLE, (m, e) => str(look(scope, e)))));
      return;
    }
    if (node.nodeType !== 1) return;
    const tag = node.tagName.toLowerCase();
    if (tag === 'sc-for') {
      const list = look(scope, node.getAttribute('list').replace(/[{}]/g, '')) || [];
      const as = node.getAttribute('as');
      list.forEach((item, i) => {
        const s = Object.assign(Object.create(scope), { [as]: item, $index: i });
        node.childNodes.forEach((c) => walk(c, s, out));
      });
      return;
    }
    if (tag === 'sc-if') {
      if (look(scope, node.getAttribute('value').replace(/[{}]/g, ''))) node.childNodes.forEach((c) => walk(c, scope, out));
      return;
    }
    const el = document.createElement(tag === 'svg' || node.namespaceURI === 'http://www.w3.org/2000/svg' ? tag : tag);
    let target = node.namespaceURI === 'http://www.w3.org/2000/svg' ? document.createElementNS('http://www.w3.org/2000/svg', node.tagName) : el;
    for (const a of node.attributes) {
      const whole = a.value.match(/^\{\{\s*([^}]+?)\s*\}\}$/);
      if (whole) {
        const v = look(scope, whole[1]);
        if (/^on[A-Z]/.test(a.name) || /^on[a-z]/.test(a.name) && typeof v === 'function') {
          if (typeof v === 'function') target.addEventListener(a.name.slice(2).toLowerCase(), v);
        } else if (typeof v === 'boolean') { if (v) target.setAttribute(a.name, ''); }
        else if (v != null) target.setAttribute(a.name, String(v));
      } else if (a.name.startsWith('hint-')) {
      } else {
        target.setAttribute(a.name, a.value.replace(HOLE, (m, e) => str(look(scope, e))));
      }
    }
    const kids = tag === 'template' ? node.content.childNodes : node.childNodes;
    kids.forEach((c) => walk(c, scope, target));
    out.appendChild(target);
  }
  window.__render = function () {
    const vals = comp.renderVals();
    const frag = document.createDocumentFragment();
    tpl.content.childNodes.forEach((c) => walk(c, vals, frag));
    root.replaceChildren(frag);
  };
  window.__render();
})();
</script>
