<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge chatbot — phone layouts</title>
<!-- REFERENCE BUILD generated from design/CbPhone.dc.html. Not production code. -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#F4F7FB}
.mono{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
</style>

</head>
<body>
<div id="root"></div>
<template id="dc-template">

<div style="width: 900px; height: 1160px; box-sizing: border-box; padding: 48px 40px; background: #F4F7FB; font-family: 'Geist', system-ui, sans-serif; color: #0B1220; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 6px">
<span class="mono" style="font-size: 13px; color: #166FE5; letter-spacing: 0.08em">KNOWLEDGE CHATBOT · PHONE</span>
<h1 style="margin: 0; font-size: 34px; letter-spacing: -0.03em; font-weight: 600">Full screen on phones</h1>
<span style="font-size: 14px; color: #4B5872; line-height: 1.5">Below 600px the panel takes the whole screen. The input sits above the keyboard and the home bar (safe-area inset). Launcher answer to the open question: keep the round bottom-right button. A bar across the bottom would cover the client's own buttons.</span>
</div>
<div style="display: flex; gap: 40px; align-items: flex-start">
<sc-for list="{{frames}}" as="f" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 10px">
<span class="mono" style="font-size: 12px; color: #4B5872">{{f.label}}</span>
<div style="width: {{f.w}}px; height: {{f.h}}px; box-sizing: border-box; border-radius: 34px; border: 8px solid #0B1220; background: #FFFFFF; overflow: hidden; display: flex; flex-direction: column; position: relative">
<div style="height: {{f.top}}px; flex: none"></div>
<div style="display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 14px; border-bottom: 1px solid #E3E9F2">
<span style="width: 36px; height: 36px; border-radius: 50%; background: #166FE5; color: #FFFFFF; display: grid; place-items: center; flex: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">Khumalo assistant</span><span style="font-size: 11px; color: #4B5872; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><span class="mono" style="font-size: 10px; padding: 1px 5px; border-radius: 5px; background: #EEF4FE">AI</span> Answers from Khumalo's own info</span></span>
<span style="width: 44px; height: 44px; display: grid; place-items: center; color: #4B5872"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></span>
</div>
<div style="flex: 1; min-height: 0; overflow: hidden; padding: 12px; display: flex; flex-direction: column; gap: 10px; justify-content: flex-end">
<div style="align-self: flex-end; max-width: 84%; padding: 9px 12px; border-radius: 16px 4px 16px 16px; background: #166FE5; color: #FFFFFF; font-size: 15px; line-height: 1.45">How much does a home system cost?</div>
<div style="align-self: flex-start; max-width: 90%; padding: 10px 12px; border-radius: 4px 16px 16px 16px; background: #F2F5F9; font-size: 15px; line-height: 1.45">The Essential package (3 kW, 5 kWh battery) is R 68 500 and the Family package (5 kW, 10 kWh) is R 112 000, installed.</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center"><span style="display: inline-flex; padding: 3px 10px; border-radius: 999px; border: 1px solid #E3E9F2; color: #4B5872; font-size: 12px">Price list 2026</span><span style="display: inline-flex; padding: 3px 10px; border-radius: 999px; border: 1px solid #E3E9F2; color: #4B5872; font-size: 12px">+1</span></div>
</div>
<div style="padding: 10px 10px 8px; border-top: 1px solid #E3E9F2; display: flex; flex-direction: column; gap: 6px; background: #FFFFFF">
<div style="display: flex; gap: 8px; align-items: center"><span style="flex: 1; min-width: 0; min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 999px; border: 2px solid {{f.inBd}}; font-size: 16px; color: {{f.inC}}; white-space: nowrap; overflow: hidden">{{f.inText}}</span><span style="width: 44px; height: 44px; border-radius: 50%; background: #166FE5; color: #FFFFFF; display: grid; place-items: center; flex: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span></div>
<div style="display: flex; justify-content: space-between; font-size: 11px; color: #4B5872"><span>AI assistant · <span style="text-decoration: underline">Privacy</span></span><span style="text-decoration: underline">Talk to a person</span></div>
</div>
<sc-if value="{{f.kb}}" hint-placeholder-val="{{ false }}"><div style="height: 260px; flex: none; background: repeating-linear-gradient(135deg, #E6EBF2 0 8px, #EEF2F8 8px 16px); display: grid; place-items: center"><span class="mono" style="font-size: 11px; color: #4B5872; background: #FFFFFF; padding: 4px 8px; border-radius: 6px">SYSTEM KEYBOARD AREA</span></div></sc-if>
<div style="height: {{f.home}}px; flex: none; background: repeating-linear-gradient(135deg, #FDE8E8 0 6px, #FFFFFF 6px 12px); display: grid; place-items: center"><span class="mono" style="font-size: 10px; color: #912018">{{f.homeLabel}}</span></div>
</div>
<span style="font-size: 12px; color: #4B5872; max-width: {{f.w}}px; line-height: 1.5">{{f.note}}</span>
</div>
</sc-for>
</div>
</div>
</template>

<script>
class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(p) { Object.assign(this.state, typeof p === 'function' ? p(this.state) : p); window.__render(); }
  forceUpdate() { window.__render(); }
}
</script>
<script>
class Component extends DCLogic {
renderVals() {
return {
frames: [
{ label: '390 × 844 · typing, keyboard open', w: 390, h: 844, top: 44, kb: true, home: 0, homeLabel: '', inText: 'Do you offer a site visit?', inBd: '#166FE5', inC: '#0B1220', note: 'Use 100dvh and the visualViewport height so the input rides above the keyboard. The message list shrinks; nothing is hidden behind the keyboard.' },
{ label: '320 × 690 · smallest supported', w: 320, h: 690, top: 36, kb: false, home: 34, homeLabel: 'HOME BAR · SAFE AREA', inText: 'Ask about packages…', inBd: '#E3E9F2', inC: '#4B5872', note: 'At 320 the header subtitle truncates, chips wrap, and the input is 16px so iOS does not zoom. Footer padding adds env(safe-area-inset-bottom).' }
]
};
}
}
</script>
<script>
(function () {
  const tpl = document.getElementById('dc-template');
  const root = document.getElementById('root');
  const qp = {}; new URLSearchParams(location.search).forEach((v, k) => { qp[k] = v === 'true' ? true : v === 'false' ? false : v; }); const comp = new Component(qp);
  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  function look(scope, expr) {
    expr = expr.trim();
    if (expr === 'true') return true;
    if (expr === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(expr)) return Number(expr);
    let v = scope;
    for (const k of expr.split('.')) { if (v == null) return undefined; v = v[k]; }
    return v;
  }
  function str(v) { return v == null ? '' : String(v); }
  function walk(node, scope, out) {
    if (node.nodeType === 3) {
      out.appendChild(document.createTextNode(node.nodeValue.replace(HOLE, (m, e) => str(look(scope, e)))));
      return;
    }
    if (node.nodeType !== 1) return;
    const tag = node.tagName.toLowerCase();
    if (tag === 'sc-for') {
      const list = look(scope, node.getAttribute('list').replace(/[{}]/g, '')) || [];
      const as = node.getAttribute('as');
      list.forEach((item, i) => {
        const s = Object.assign(Object.create(scope), { [as]: item, $index: i });
        node.childNodes.forEach((c) => walk(c, s, out));
      });
      return;
    }
    if (tag === 'sc-if') {
      if (look(scope, node.getAttribute('value').replace(/[{}]/g, ''))) node.childNodes.forEach((c) => walk(c, scope, out));
      return;
    }
    const el = document.createElement(tag === 'svg' || node.namespaceURI === 'http://www.w3.org/2000/svg' ? tag : tag);
    let target = node.namespaceURI === 'http://www.w3.org/2000/svg' ? document.createElementNS('http://www.w3.org/2000/svg', node.tagName) : el;
    for (const a of node.attributes) {
      const whole = a.value.match(/^\{\{\s*([^}]+?)\s*\}\}$/);
      if (whole) {
        const v = look(scope, whole[1]);
        if (/^on[A-Z]/.test(a.name) || /^on[a-z]/.test(a.name) && typeof v === 'function') {
          if (typeof v === 'function') target.addEventListener(a.name.slice(2).toLowerCase(), v);
        } else if (typeof v === 'boolean') { if (v) target.setAttribute(a.name, ''); }
        else if (v != null) target.setAttribute(a.name, String(v));
      } else if (a.name.startsWith('hint-')) {
      } else {
        target.setAttribute(a.name, a.value.replace(HOLE, (m, e) => str(look(scope, e))));
      }
    }
    const kids = tag === 'template' ? node.content.childNodes : node.childNodes;
    kids.forEach((c) => walk(c, scope, target));
    out.appendChild(target);
  }
  window.__render = function () {
    const vals = comp.renderVals();
    const frag = document.createDocumentFragment();
    tpl.content.childNodes.forEach((c) => walk(c, vals, frag));
    root.replaceChildren(frag);
    if (window.__mounted && comp.componentDidUpdate) comp.componentDidUpdate();
    if (!window.__mounted) { window.__mounted = true; if (comp.componentDidMount) comp.componentDidMount(); }
  };
  window.__render();
})();
</script>
</body>
</html>
