<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Website admin — Services and prices</title>
<!-- REFERENCE BUILD generated from design/LwServices.dc.html. Not production code. -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#F4F7FB}
.bl{font-family:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;color:#0B1220;-webkit-font-smoothing:antialiased}
.mono{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
a{color:var(--acc);text-decoration:none}a:hover{color:var(--acc-h)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.btn{font:inherit;cursor:pointer;border:0;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;font-weight:600;font-size:15px;white-space:nowrap;transition:transform .2s,box-shadow .2s,background .2s,border-color .2s,color .2s}
.btn-sm{min-height:36px;padding:0 14px;font-size:14px}
.btn-primary{background:var(--acc);color:#FFFFFF}
.btn-primary:hover:not(:disabled){background:var(--acc-h);color:#FFFFFF;box-shadow:0 10px 24px -10px var(--acc-ring)}
.btn-primary:disabled{background:#C9D3E3;color:#4B5872;cursor:not-allowed}
.btn-ghost{background:#FFFFFF;color:#0B1220;border:1px solid #D5DEEB}
.btn-ghost:hover{border-color:var(--acc);color:var(--acc)}
.btn-danger{background:#FFFFFF;color:#B42318;border:1px solid #F1C9C5}
.btn-danger:hover{background:#FEF3F2}
.btn-ok{background:#0B7A55;color:#FFFFFF}
.btn-ok:hover:not(:disabled){background:#086545;color:#FFFFFF}
.btn-ok:disabled{background:#C9D3E3;color:#4B5872;cursor:not-allowed}
.search{font:inherit;font-size:15px;width:240px;max-width:100%;min-height:44px;box-sizing:border-box;padding:0 14px 0 40px;border:1px solid #E3E9F2;border-radius:12px;background:#F8FAFD;color:#0B1220;transition:border-color .2s,box-shadow .2s,background .2s}
.search:focus{outline:none;border-color:var(--acc);background:#FFFFFF;box-shadow:0 0 0 4px var(--acc-ring)}
.search::placeholder{color:#6B7891}
.field{font:inherit;font-size:15px;color:#0B1220;width:100%;box-sizing:border-box;min-height:46px;padding:11px 14px;border:1px solid #D5DEEB;border-radius:12px;background:#FFFFFF;transition:border-color .2s,box-shadow .2s}
.field:hover{border-color:#A9B8CF}
.field:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-ring)}
.field::placeholder{color:#6B7891}
.lbl{font-size:14px;font-weight:500;color:#33405A}
.hint{font-size:13px;color:#4B5872}
.snav{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:12px;color:#B7C3D9;font-size:15px;font-weight:500;white-space:nowrap;transition:background .2s,color .2s}
.snav:hover{background:#101E3A;color:#FFFFFF}
.snav.on{background:var(--acc);color:#FFFFFF}
.snav.off{opacity:.55;cursor:default}.snav.off:hover{background:transparent;color:#B7C3D9}
.panel{background:#FFFFFF;border:1px solid #E3E9F2;border-radius:18px}
.tab{font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:500;white-space:nowrap;transition:all .2s}
.row{transition:background .15s}.row:hover{background:#F8FAFD}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;padding:4px 9px;border-radius:999px;white-space:nowrap}
.ibtn{font:inherit;cursor:pointer;width:40px;height:40px;border-radius:10px;border:1px solid transparent;background:transparent;color:#4B5872;display:grid;place-items:center;transition:all .15s}
.ibtn:hover{border-color:#D5DEEB;background:#FFFFFF;color:var(--acc)}
.sw{font:inherit;cursor:pointer;position:relative;flex:none;width:44px;height:26px;border-radius:999px;border:0;padding:0;transition:background .2s}
.sw .knob{position:absolute;top:3px;width:20px;height:20px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(11,18,32,.3);transition:left .2s}
.ai{display:inline-flex;align-items:center;gap:5px;font-family:'Geist Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.06em;padding:3px 7px;border-radius:6px;background:#F1ECFE;color:#5B21B6}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.d1{animation-delay:.06s}.d2{animation-delay:.12s}.d3{animation-delay:.18s}
@keyframes slide{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.slide{animation:slide .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes toast{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.toast{animation:toast .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.scrim{animation:fadein .2s ease both}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.modal{animation:pop .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes bar{from{background-position:0 0}to{background-position:40px 0}}
.prog{background-image:linear-gradient(45deg,rgba(255,255,255,.25) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.25) 50%,rgba(255,255,255,.25) 75%,transparent 75%);background-size:20px 20px;animation:bar 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--acc-ring)}100%{box-shadow:0 0 0 8px transparent}}
.pulse{animation:pulse 1.8s ease-out infinite}
.dot{width:7px;height:7px;border-radius:50%;background:#4B5872;animation:dot 1.2s infinite ease-in-out}
.dot.b{animation-delay:.15s}.dot.c{animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.caret{display:inline-block;width:2px;height:16px;background:var(--acc);vertical-align:-3px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (max-width: 900px){.side{flex:1 1 100%!important;min-width:0;max-width:100%;flex-direction:row!important;flex-wrap:wrap!important;align-items:center!important;gap:10px!important;padding:12px 16px!important}.snavs{flex-direction:row!important;overflow-x:auto;width:100%;min-width:0;position:relative}.sfoot,.wscard{display:none!important}.pad{padding-left:16px!important;padding-right:16px!important}}
@media (max-width: 760px){.hide-sm{display:none!important}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.snav.on{box-shadow:inset 3px 0 0 #FFFFFF}
.ws-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#B7C3D9}
.srow{display:grid;grid-template-columns:76px minmax(0,2fr) 120px 110px 120px;gap:12px;align-items:center;padding:14px 18px;border-top:1px solid #EEF2F8}
.shead{font-size:12px;color:#4B5872;font-weight:500;padding-top:10px;padding-bottom:10px;border-top:0}
.mv{font:inherit;cursor:pointer;width:32px;height:32px;border-radius:8px;border:1px solid #E3E9F2;background:#FFFFFF;color:#4B5872;display:grid;place-items:center}
.mv:disabled{opacity:.35;cursor:not-allowed}
.mv:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
.cnt{font-family:'Geist Mono',ui-monospace,monospace;font-size:12px}
.chk{display:flex;align-items:center;gap:10px;font-size:15px;cursor:pointer;min-height:40px}
.chk input{width:18px;height:18px;accent-color:var(--acc);margin:0}
.narrow .srow{grid-template-columns:76px minmax(0,1fr) 110px 120px}.narrow .c-len{display:none!important}
@media (max-width: 900px){.srow{grid-template-columns:64px minmax(0,1fr) auto auto;column-gap:10px;padding:14px 12px}.c-len{display:none!important}.shead{display:none}}
@media (max-width: 440px){.srow{grid-template-columns:64px minmax(0,1fr) auto!important}.c-price{display:none!important}}
@media (max-width: 1100px){.svc-aside{position:fixed!important;inset:0 0 0 auto;width:min(460px,100%)!important;z-index:45;box-shadow:-20px 0 60px -20px rgba(11,18,32,.4)}}
@media (max-width: 600px){.svc-aside{width:100%!important}}
</style>

</head>
<body>
<div id="root"></div>
<template id="dc-template">

<div class="bl" style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #F4F7FB; {{brandVars}}">
<aside class="side" style="flex: 0 0 264px; background: #07101F; color: #FFFFFF; display: flex; flex-direction: column; gap: 22px; padding: 22px 16px; box-sizing: border-box">
<a href="{{homeHref}}" aria-label="{{brandName}} admin home" style="display: flex; align-items: center; gap: 10px; color: #FFFFFF; font-weight: 700; font-size: 20px; letter-spacing: -0.04em; padding: 0 8px; min-height: 44px">
<sc-if value="{{isByteleaf}}" hint-placeholder-val="{{ true }}"><svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#1877F2"></rect><path d="M8 24C8 14 14 8 24 8C24 18 18 24 8 24Z" fill="#FFFFFF"></path><path d="M8.5 23.5L18 14M13 19h4.5M15.5 16.5v-3.5" stroke="#1877F2" stroke-width="1.8" stroke-linecap="round" fill="none"></path><circle cx="18" cy="14" r="1.6" fill="#1877F2"></circle></svg></sc-if>
<sc-if value="{{notByteleaf}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 9px; background: var(--acc); color: #FFFFFF; display: grid; place-items: center; font-size: 15px; letter-spacing: 0">{{brandMark}}</span></sc-if>
<span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0">{{brandName}}</span>
<span class="mono" style="font-size: 10px; font-weight: 500; letter-spacing: 0.08em; color: #B7C3D9; border: 1px solid #33415E; border-radius: 6px; padding: 2px 6px">ADMIN</span>
</a>
<div class="wscard" style="display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 14px; background: #0B1730; border: 1px solid #1C2B47">
<span class="mono" style="font-size: 10px; letter-spacing: 0.08em; color: #8A98B3">WEBSITE</span>
<div style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 10px; border-radius: 10px; border: 1px solid #22345A; background: #07101F">
<span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 50%; background: {{bizDot}}; color: #FFFFFF; display: grid; place-items: center; flex: none; font-size: 12px; font-weight: 700">{{bizMark}}</span>
<span style="flex: 1; display: flex; flex-direction: column; min-width: 0"><span style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{bizName}}</span><span style="font-size: 11px; color: #8A98B3">{{bizSub}}</span></span>
</div>
<span class="ws-chip" role="status"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: {{numDot}}"></span>{{numText}}</span>
</div>
<nav aria-label="Website admin" class="snavs" style="display: flex; flex-direction: column; gap: 4px">
<a class="snav" href="lw-overview.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12l9-8 9 8M5 10v10h14V10"></path></svg><span style="flex: 1">Overview</span></a>
<a class="snav" href="lw-pages.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 13h8M8 17h5"></path></svg><span style="flex: 1">Pages</span></a>
<a class="snav on" href="lw-services.html" aria-current="page"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg><span style="flex: 1">Services &amp; prices</span></a>
<a class="snav" href="lw-photos.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18v14H3zM8 11a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM21 17l-5-5-9 7"></path></svg><span style="flex: 1">Photos</span></a>
<a class="snav" href="admin-messages.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v12H5.2L4 17.2zM8 8h8M8 12h5"></path></svg><span style="flex: 1">Enquiries</span><span class="mono" style="min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--acc); color: #FFFFFF; font-size: 11px; display: grid; place-items: center; box-sizing: border-box">2<span class="sr"> new</span></span></a>
<a class="snav" href="admin-bookings.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9h18M7 3v4M17 3v4M5 5h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"></path></svg><span style="flex: 1">Bookings</span></a>
<a class="snav" href="lw-settings.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg><span style="flex: 1">Site settings</span></a>
<span class="snav off" aria-disabled="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"></path></svg><span style="flex: 1">Go-live checklist</span><span class="mono" style="font-size: 10px; padding: 2px 6px; border-radius: 6px; border: 1px solid #33415E; color: #8A98B3">SOON</span></span>
</nav>
<div class="sfoot" style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
<sc-if value="{{isByteleaf}}" hint-placeholder-val="{{ true }}"><a class="snav" href="admin-dashboard.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg>byteleaf admin</a></sc-if>
<div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; background: #0B1730; border: 1px solid #1C2B47">
<span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 50%; background: var(--acc); display: grid; place-items: center; font-weight: 600; flex: none">{{userMark}}</span>
<span style="flex: 1; display: flex; flex-direction: column; min-width: 0"><span style="font-size: 14px; font-weight: 600">{{userName}}</span><span style="font-size: 12px; color: #8A98B3">{{userRole}}</span></span>
<a href="admin-login.html" aria-label="Sign out" style="color: #B7C3D9; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg></a>
</div>
</div>
</aside>
<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
<header class="pad" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; padding: 18px 32px; background: #FFFFFF; border-bottom: 1px solid #E3E9F2">
<div style="display: flex; flex-direction: column; gap: 2px"><span class="mono" style="font-size: 12px; color: #4B5872">{{bizName}} / Website</span><h1 style="margin: 0; font-size: 26px; letter-spacing: -0.03em; font-weight: 600">Services &amp; prices</h1></div>
<button type="button" class="btn btn-primary" onClick="{{addNew}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add a service</button>
</header>
<div style="flex: 1; display: flex; min-height: 0">
<div class="pad" style="flex: 1; min-width: 0; padding: 24px 32px 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">

<sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}">
<div class="panel rise" style="padding: 48px 24px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px">
<span aria-hidden="true" style="width: 60px; height: 60px; border-radius: 18px; background: var(--acc-soft); color: var(--acc-t); display: grid; place-items: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"></path></svg></span>
<h2 style="margin: 0; font-size: 22px; letter-spacing: -0.02em">What do you offer?</h2>
<p style="margin: 0; max-width: 460px; font-size: 15px; line-height: 1.55; color: #4B5872">Add each service with its price and what’s included. They appear on your Home page and on Services and prices, in the order you set here.</p>
<button type="button" class="btn btn-primary" onClick="{{addNew}}">Add your first service</button>
</div>
</sc-if>

<sc-if value="{{hasList}}" hint-placeholder-val="{{ true }}">
<sc-if value="{{showSearch}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center"><div style="position: relative; flex: 1 1 260px; max-width: 360px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B7891" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 13px; top: 13px"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg><label for="sq" class="sr">Find a service</label><input id="sq" class="search" type="search" value="{{q}}" onInput="{{onQ}}" placeholder="Find a service" style="width: 100%"></div><span class="hint">{{countText}} · long lists show the first 6 on your Home page</span></div>
</sc-if>
<div class="panel {{listCls}}" style="overflow: hidden">
<div class="srow shead" aria-hidden="true"><span>Order</span><span>Service</span><span class="c-len">Time</span><span>Price</span><span style="text-align: right">On the site</span></div>
<ol style="list-style: none; margin: 0; padding: 0">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
<li class="srow row" style="{{r.bg}}">
<span style="display: flex; gap: 4px"><button type="button" class="mv" aria-label="Move {{r.name}} up" onClick="{{r.up}}" disabled="{{r.first}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 15l-6-6-6 6"></path></svg></button><button type="button" class="mv" aria-label="Move {{r.name}} down" onClick="{{r.down}}" disabled="{{r.last}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button></span>
<button type="button" onClick="{{r.edit}}" style="font: inherit; cursor: pointer; border: 0; background: transparent; padding: 0; text-align: left; min-width: 0; display: flex; flex-direction: column; gap: 3px; color: #0B1220"><span style="font-weight: 600; font-size: 15px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center">{{r.name}}<sc-if value="{{r.unpub}}" hint-placeholder-val="{{ false }}"><span class="pill" style="background: #EEF4FE; color: #0B3A80">NOT PUBLISHED</span></sc-if></span><span style="font-size: 13px; color: #4B5872; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.inc}}</span></button>
<span class="c-len" style="font-size: 14px">{{r.time}}</span>
<span class="c-price" style="font-size: 14px; font-weight: 600; color: {{r.priceC}}">{{r.price}}</span>
<span style="display: flex; justify-content: flex-end"><button type="button" class="sw" role="switch" aria-checked="{{r.on}}" aria-label="Show {{r.name}} on the site" onClick="{{r.toggle}}" style="background: {{r.swBg}}"><span class="knob" style="left: {{r.swL}}"></span></button></span>
</li>
</sc-for>
</ol>
<sc-if value="{{noMatch}}" hint-placeholder-val="{{ false }}"><p class="hint" style="margin: 0; padding: 18px; border-top: 1px solid #EEF2F8">No service matches “{{q}}”.</p></sc-if>
</div>
<p class="hint" style="margin: 0">Hidden services stay saved but don’t show on the site. Changes go live when you publish.</p>
</sc-if>
</div>

<sc-if value="{{drawer}}" hint-placeholder-val="{{ false }}">
<aside class="svc-aside slide" role="dialog" aria-modal="false" aria-labelledby="ed-h" style="flex: 0 0 440px; width: 440px; box-sizing: border-box; background: #FFFFFF; border-left: 1px solid #E3E9F2; display: flex; flex-direction: column; max-height: 100vh; overflow-y: auto">
<div style="padding: 16px 20px; border-bottom: 1px solid #EEF2F8; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; background: #FFFFFF; z-index: 2">

<div style="display: flex; align-items: center; justify-content: space-between; gap: 14px"><span style="display: flex; flex-direction: column; gap: 2px"><span id="w-l" style="font-weight: 500">Show on the site</span><span class="hint">Off = saved, but hidden from customers.</span></span><button type="button" class="sw" role="switch" aria-checked="{{fOn}}" aria-labelledby="w-l" onClick="{{togOn}}" style="background: {{fSwBg}}"><span class="knob" style="left: {{fSwL}}"></span></button></div>

<script>
class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(p) { Object.assign(this.state, typeof p === 'function' ? p(this.state) : p); window.__render(); }
  forceUpdate() { window.__render(); }
}
</script>
<script>
class Component extends DCLogic {

const B = {

tsela: { acc: '#1D6B47', h: '#175A3B', t: '#175A3B', soft: '#E8F3EC', ring: 'rgba(29,107,71,.2)', name: 'Tsela', mark: 't', biz: 'Tsela Mobile Wash', bizMark: 't', bizSub: 'Mobile car wash · Pretoria', bizDot: '#1D6B47', user: '[Owner name]', userRole: 'Owner' },
spark: { acc: '#C2410C', h: '#A3360A', t: '#A3360A', soft: '#FDF0E8', ring: 'rgba(194,65,12,.2)', name: 'Bright Spark', mark: 'B', biz: 'Bright Spark Electrical', bizMark: 'B', bizSub: 'Electrician · Durban', bizDot: '#C2410C', user: '[Owner name]', userRole: 'Owner' }
};
const k = B[this.props.brand] ? this.props.brand : 'tsela';
const b = B[k];
const n = (this.state && this.state.pend) ? this.state.pend.length : 0;
return {
brandVars: '--acc: ' + b.acc + '; --acc-h: ' + b.h + '; --acc-t: ' + b.t + '; --acc-soft: ' + b.soft + '; --acc-ring: ' + b.ring + ';',
brandKey: k, isByteleaf: k === 'byteleaf', notByteleaf: k !== 'byteleaf', brandName: b.name, brandMark: b.mark,
homeHref: 'LwOverview.dc.html', bizName: b.biz, bizMark: b.bizMark, bizSub: b.bizSub, bizDot: b.bizDot,
userName: b.user, userMark: b.user[0] === '[' ? 'O' : b.user[0], userRole: b.userRole,
numBad: n > 0, numDot: n > 0 ? '#F79009' : '#12B76A', numText: n > 0 ? n + (n === 1 ? ' change' : ' changes') + ' not published' : 'Site is live · all changes published'
};
}
pubVals() {
const st = this.state;
const n = st.pend.length;
const ph = st.pubPhase || '';
const disc = ph === 'discard';
return {
pubShow: n > 0, pubCount: n + (n === 1 ? ' change' : ' changes') + ' not published',
pubFailed: ph === 'failed', publishing: ph === 'publishing', publishLabel: ph === 'publishing' ? 'Publishing…' : ph === 'failed' ? 'Try again' : 'Publish',
askPublish: () => this.setState({ pubPhase: 'confirm' }), askDiscard: () => this.setState({ pubPhase: 'discard' }),
pubModal: ph === 'confirm' || disc,
pubModalTitle: disc ? 'Discard ' + n + (n === 1 ? ' change?' : ' changes?') : 'Publish ' + n + (n === 1 ? ' change?' : ' changes?'),
pubList: st.pend.map((c) => c.label),
pubModalText: disc ? 'These edits are removed. Your live site stays exactly as it is now.' : 'Your live site updates straight away. You can undo for 10 seconds afterwards.',
pubNoL: disc ? 'Keep editing' : 'Not yet', pubYesL: disc ? 'Discard changes' : 'Publish now',
pubYesSt: disc ? 'background: #B42318; color: #FFFFFF;' : 'background: var(--acc); color: #FFFFFF;',
closePub: () => this.setState({ pubPhase: '' }),
pubYes: () => {
if (disc) { const snap = st.pend; this.setState({ pubPhase: '', pend: [], pubToast: 'Changes discarded. Your live site is unchanged.', undoPend: null }); if (this.onDiscard) this.onDiscard(snap); this.pubFlash(); return; }
this.setState({ pubPhase: 'publishing' });
clearTimeout(this.tp);
this.tp = setTimeout(() => {
if (this.props.publish === 'fails' && !this.failedOnce) { this.failedOnce = true; this.setState({ pubPhase: 'failed' }); return; }
const snap = this.state.pend;
this.setState({ pubPhase: '', pend: [], undoPend: snap, pubToast: 'Published. Your site is up to date.' });
if (this.onPublish) this.onPublish(snap);
this.pubFlash(10000);
}, 900);
},
pubToast: !!st.pubToast, pubToastText: st.pubToast || '', pubUndo: !!st.undoPend,
undoPublish: () => { const snap = st.undoPend; this.setState({ pend: snap, undoPend: null, pubToast: 'Undone. The live site is back to how it was.' }); if (this.onUndo) this.onUndo(snap); this.pubFlash(); }
};
}
pubFlash(ms) { clearTimeout(this.tf); this.tf = setTimeout(() => this.setState({ pubToast: '', undoPend: null }), ms || 4000); }

constructor(props) {
super(props);
this.seed = [
{ id: 's1', name: 'Express wash', price: '120', ask: false, time: '45 minutes', inc: ['Hand wash and dry, outside', 'Wheels and tyres', 'Windows inside and out'], on: true },
{ id: 's2', name: 'Full wash and vacuum', price: '250', ask: false, time: '1 hour 30 minutes', inc: ['Everything in the Express wash', 'Vacuum seats, carpets and boot', 'Dashboard and doors wiped'], on: true },
{ id: 's3', name: 'Interior deep clean', price: '480', ask: false, time: '2 hours', inc: ['Seats and carpets shampooed', 'Stain treatment', 'Vents, seams and cup holders detailed'], on: true },
{ id: 's4', name: 'Polish and wax', price: '650', ask: false, time: '3 hours', inc: ['Full wash and clay treatment', 'Machine polish', 'Hand wax for protection'], on: true },
{ id: 's5', name: 'Fleet wash', price: '', ask: true, time: 'Depends on the job', inc: ['Three or more cars at one address', 'Weekly or monthly visits'], on: false }
];
const extra = ['Engine bay clean|150', 'Pet hair removal|90', 'Headlight restore|200', 'Seat shampoo only|220', 'Odour treatment|180', 'Rim polish|160', 'Leather conditioning|240', 'Bakkie load bin wash|90', 'Boat wash|0'].map((x, i) => ({ id: 'x' + i, name: x.split('|')[0], price: x.split('|')[1] === '0' ? '' : x.split('|')[1], ask: x.split('|')[1] === '0', time: '45 minutes', inc: ['Add-on to any wash'], on: true }));
const list = props.list === 'empty' ? [] : props.list === 'long' ? this.seed.concat(extra) : this.seed;
this.live = JSON.parse(JSON.stringify(list));
this.state = { list: list, edit: '', f: null, orig: '', err: {}, saving: false, dlg: '', toast: '', q: '', pend: [], pubPhase: '', pubToast: '', undoPend: null };
}
componentDidMount() { this.onK = (e) => { if (e.key === 'Escape') { if (this.state.dlg) this.setState({ dlg: '' }); else if (this.state.edit) this.tryClose(); } }; document.addEventListener('keydown', this.onK); }

renderVals() {
const st = this.state;
const br = this.brand();
const priceTxt = (s) => (s.ask ? 'Ask for a price' : s.price ? 'R ' + s.price : 'No price yet');
const set = (patch) => this.setState({ f: Object.assign({}, st.f, patch), err: {} });
const f = st.f || { name: '', price: '', ask: false, time: '1 hour', inc: [''], on: true };
const nl = f.name.length;
const q = st.q.trim().toLowerCase();
const shown = st.list.filter((s) => !q || s.name.toLowerCase().indexOf(q) > -1);
const liveIds = this.live.map((s) => JSON.stringify(s));
const open = (s) => { const f0 = JSON.parse(JSON.stringify(s)); this.setState({ edit: s.id, f: f0, orig: JSON.stringify(f0), err: {} }); };
const move = (s, dir) => { const a = st.list.slice(); const i = a.findIndex((x) => x.id === s.id); const j = i + dir; const t = a[i]; a[i] = a[j]; a[j] = t; this.setState({ list: a }); this.addPend('order', 'Services reordered'); };
const dlg = st.dlg;
const TIMES = ['30 minutes', '45 minutes', '1 hour', '1 hour 30 minutes', '2 hours', '3 hours', '4 hours', 'Depends on the job'];
return Object.assign(br, this.pubVals(), {
isEmpty: !st.list.length, hasList: st.list.length > 0, showSearch: st.list.length > 8, q: st.q, onQ: (e) => this.setState({ q: e.target.value }), countText: st.list.length + ' services', noMatch: !!q && !shown.length,
addNew: () => { const f0 = { id: 'new', name: '', price: '', ask: false, time: '1 hour', inc: [''], on: true }; this.setState({ edit: 'new', f: f0, orig: JSON.stringify(f0), err: {} }); },
rows: shown.map((s, i) => ({ name: s.name, inc: s.inc.filter(Boolean).join(' · ') || 'Nothing listed yet', time: s.time, price: priceTxt(s), priceC: s.ask ? '#4B5872' : '#0B1220', unpub: liveIds.indexOf(JSON.stringify(s)) < 0,
on: s.on ? 'true' : 'false', swBg: s.on ? 'var(--acc)' : '#C9D3E3', swL: s.on ? '21px' : '3px',
toggle: () => { this.setState({ list: st.list.map((x) => (x.id === s.id ? Object.assign({}, x, { on: !x.on }) : x)) }); this.addPend('vis-' + s.id, s.name + (s.on ? ' hidden from the site' : ' shown on the site')); },
first: st.list[0] && st.list[0].id === s.id, last: st.list[st.list.length - 1].id === s.id, up: () => move(s, -1), down: () => move(s, 1), edit: () => open(s), bg: st.edit === s.id ? 'background: var(--acc-soft);' : '' })),

nameBad: st.err.name ? 'true' : 'false', nameRole: st.err.name ? 'alert' : '', nameHC: st.err.name || nl > 40 ? '#B42318' : '#4B5872', nameHint: st.err.name || (nl > 40 ? 'Too long. Names over 40 characters wrap badly on phones.' : 'Use the name customers would say.'),
onName: (e) => set({ name: e.target.value }), onPrice: (e) => set({ price: e.target.value.replace(/[^0-9]/g, '') }),

fOn: f.on ? 'true' : 'false', fSwBg: f.on ? 'var(--acc)' : '#C9D3E3', fSwL: f.on ? '21px' : '3px', togOn: () => set({ on: !f.on }),
pvName: f.name || 'Service name', pvInc: f.inc.filter(Boolean).join(' · ') || 'What’s included', pvPrice: f.ask ? 'Ask for a price' : f.price ? 'R ' + f.price : 'R —',

save: (e) => { e.preventDefault(); const er = {}; if (!f.name.trim()) er.name = 'Give the service a name.'; else if (nl > 40) er.name = 'Use 40 characters or fewer.'; if (!f.ask && !f.price) er.price = 'Add a price, or tick “No fixed price”.'; if (Object.keys(er).length) { this.setState({ err: er }); return; } this.setState({ saving: true }); clearTimeout(this.ts); this.ts = setTimeout(() => { const s = this.state; const isNew = s.edit === 'new'; const item = Object.assign({}, s.f, { id: isNew ? 'n' + Date.now() : s.edit, inc: s.f.inc.filter((x) => x.trim()) }); const old = s.list.find((x) => x.id === s.edit); this.setState({ saving: false, edit: '', f: null, list: isNew ? s.list.concat([item]) : s.list.map((x) => (x.id === s.edit ? item : x)) }); this.addPend('svc-' + item.id, isNew ? item.name + ' added' : (old && old.price !== item.price ? item.name + ': price R ' + old.price + ' → R ' + item.price : item.name + ' edited')); this.flash('Saved as a draft. Publish to show it on your site.'); }, 700); },
canDelete: st.edit && st.edit !== 'new', askDel: () => this.setState({ dlg: 'delete' }),
dlg: !!dlg, dlgTitle: dlg === 'delete' ? 'Delete ' + f.name + '?' : 'Close without saving?',
dlgText: dlg === 'delete' ? 'It disappears from the site when you publish. Enquiries and bookings that mention it keep their details.' : 'Your edits to this service will be lost.',
dlgNoL: dlg === 'delete' ? 'Keep it' : 'Keep editing', dlgYesL: dlg === 'delete' ? 'Delete service' : 'Close without saving', dlgNo: () => this.setState({ dlg: '' }),
dlgYes: () => { if (dlg === 'delete') { const nm = f.name; const id = st.edit; this.setState({ dlg: '', edit: '', f: null, list: st.list.filter((x) => x.id !== id) }); this.addPend('svc-' + id, nm + ' deleted'); this.flash(nm + ' deleted. Publish to remove it from the site.'); } else this.setState({ dlg: '', edit: '', f: null }); },
toast: !!st.toast, toastText: st.toast
});
}
}

<script>
(function () {
  const tpl = document.getElementById('dc-template');
  const root = document.getElementById('root');
  const qp = {}; new URLSearchParams(location.search).forEach((v, k) => { qp[k] = v === 'true' ? true : v === 'false' ? false : v; }); const comp = new Component(qp);
  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  function look(scope, expr) {
    expr = expr.trim();
    if (expr === 'true') return true;
    if (expr === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(expr)) return Number(expr);
    let v = scope;
    for (const k of expr.split('.')) { if (v == null) return undefined; v = v[k]; }
    return v;
  }
  function str(v) { return v == null ? '' : String(v); }
  function walk(node, scope, out) {
    if (node.nodeType === 3) {
      out.appendChild(document.createTextNode(node.nodeValue.replace(HOLE, (m, e) => str(look(scope, e)))));
      return;
    }
    if (node.nodeType !== 1) return;
    const tag = node.tagName.toLowerCase();
    if (tag === 'sc-for') {
      const list = look(scope, node.getAttribute('list').replace(/[{}]/g, '')) || [];

      list.forEach((item, i) => {
        const s = Object.assign(Object.create(scope), { [as]: item, $index: i });
        node.childNodes.forEach((c) => walk(c, s, out));

    }
    if (tag === 'sc-if') {
      if (look(scope, node.getAttribute('value').replace(/[{}]/g, ''))) node.childNodes.forEach((c) => walk(c, scope, out));
      return;
    }

    let target = node.namespaceURI === 'http://www.w3.org/2000/svg' ? document.createElementNS('http://www.w3.org/2000/svg', node.tagName) : el;
    for (const a of node.attributes) {
      const whole = a.value.match(/^\{\{\s*([^}]+?)\s*\}\}$/);
      if (whole) {
        const v = look(scope, whole[1]);
        if (/^on[A-Z]/.test(a.name) || /^on[a-z]/.test(a.name) && typeof v === 'function') {
          if (typeof v === 'function') target.addEventListener(a.name.slice(2).toLowerCase(), v);
        } else if (typeof v === 'boolean') { if (v) target.setAttribute(a.name, ''); }
        else if (v != null) target.setAttribute(a.name, String(v));
      } else if (a.name.startsWith('hint-')) {
      } else {
        target.setAttribute(a.name, a.value.replace(HOLE, (m, e) => str(look(scope, e))));
      }
    }

    kids.forEach((c) => walk(c, scope, target));

  }

    const vals = comp.renderVals();
    const frag = document.createDocumentFragment();
    tpl.content.childNodes.forEach((c) => walk(c, vals, frag));
