<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
.bl{font-family:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;color:#0B1220;-webkit-font-smoothing:antialiased}
.mono{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a{color:#166FE5;text-decoration:none}a:hover{color:#0B4FB3}
:focus-visible{outline:3px solid #166FE5;outline-offset:2px}
.navlink{color:#33405A;font-size:15px;font-weight:500;padding:10px 14px;border-radius:999px;transition:background .2s,color .2s}
.navlink:hover{background:#EEF4FE;color:#0B1220}
.navlink.on{background:#EEF4FE;color:#166FE5}
.btn{font:inherit;cursor:pointer;border:0;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border-radius:999px;font-weight:600;font-size:16px;transition:transform .25s,box-shadow .25s,background .25s,border-color .25s,color .25s}
.btn-primary{background:#166FE5;color:#FFFFFF}
.btn-primary:hover{background:#0F5FCC;color:#FFFFFF;transform:translateY(-2px);box-shadow:0 12px 28px -10px rgba(22,111,229,.7)}
.btn-ghost{color:#0B1220;border:1px solid #D5DEEB;background:#FFFFFF}
.btn-ghost:hover{border-color:#166FE5;color:#166FE5}
.btn-light{background:#FFFFFF;color:#0B1220}
.btn-light:hover{color:#0B1220;transform:translateY(-2px);box-shadow:0 12px 28px -10px rgba(0,0,0,.5)}
.btn-sm{min-height:40px;padding:0 16px;font-size:14px}
.arr{transition:transform .25s}.btn:hover .arr{transform:translateX(4px)}
.flink{color:#B7C3D9}.flink:hover{color:#FFFFFF}
.ftab{font:inherit;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:48px;padding:0 16px;border-radius:14px;border:1px solid #E3E9F2;background:#FFFFFF;color:#33405A;font-size:15px;font-weight:500;text-align:left;transition:all .2s}
.ftab[aria-selected="true"]{border-color:#0B1220;background:#0B1220;color:#FFFFFF}
.ftab .n{font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#EEF2F8;color:#33405A}
.ftab[aria-selected="true"] .n{background:#FFFFFF;color:#0B1220}
.phone{width:min(360px,100%);height:720px;box-sizing:border-box;border-radius:44px;background:#0B1220;padding:10px;box-shadow:0 40px 80px -40px rgba(11,18,32,.55)}
.scr{position:relative;width:100%;height:100%;border-radius:34px;overflow:hidden;background:#ECEFF3;display:flex;flex-direction:column}
.bub{max-width:82%;padding:8px 11px 5px;font-size:14px;line-height:1.42;color:#0B1220;box-shadow:0 1px 1px rgba(11,18,32,.08);animation:msgIn .25s ease-out both}
.bub.biz{align-self:flex-start;background:#FFFFFF;border-radius:4px 14px 14px 14px}
.bub.me{align-self:flex-end;background:#DCE6F4;border-radius:14px 4px 14px 14px}
.bub.staff{align-self:flex-start;background:#FFFFFF;border-radius:4px 14px 14px 14px;border-left:3px solid #8B2F7E}
.tm{display:block;text-align:right;font-size:10px;color:#6B7891;margin-top:1px}
.rbs{align-self:flex-start;width:82%;display:flex;flex-direction:column;gap:3px;margin-top:-4px;animation:msgIn .25s ease-out both}
.rb{font:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;min-height:36px;border:0;background:#FFFFFF;border-radius:10px;font-size:14px;font-weight:500;color:#1F5FAD;box-shadow:0 1px 1px rgba(11,18,32,.08);transition:box-shadow .2s,background .2s}
.rb:hover{background:#F6F9FD}
.rb.go{box-shadow:0 0 0 2px #166FE5,0 0 0 6px rgba(22,111,229,.18);animation:hint 1.6s ease-in-out infinite}
.rb:disabled{cursor:default;color:#6B7891;box-shadow:none;background:#F7F8FA}
@keyframes hint{0%,100%{box-shadow:0 0 0 2px #166FE5,0 0 0 6px rgba(22,111,229,.18)}50%{box-shadow:0 0 0 2px #166FE5,0 0 0 10px rgba(22,111,229,.06)}}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#FFFFFF;border-radius:20px 20px 0 0;box-shadow:0 -20px 40px -20px rgba(11,18,32,.4);animation:up .3s cubic-bezier(.2,.8,.2,1) both;max-height:75%;display:flex;flex-direction:column}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.srow{font:inherit;cursor:pointer;width:100%;display:flex;align-items:center;gap:12px;padding:10px 16px;border:0;border-top:1px solid #EEF2F8;background:#FFFFFF;text-align:left;color:#0B1220}
.srow.go{background:#EEF4FE}
.radio{width:18px;height:18px;border-radius:50%;border:2px solid #A9B8CF;flex:none;box-sizing:border-box}
.srow.go .radio{border:5px solid #166FE5}
.dot{width:7px;height:7px;border-radius:50%;background:#6B7891;animation:dot 1.2s infinite ease-in-out}
.dot.b{animation-delay:.15s}.dot.c{animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.blk{position:absolute;left:3px;right:3px;box-sizing:border-box;border-radius:8px;padding:5px 7px;font-size:11px;line-height:1.3;overflow:hidden;display:flex;flex-direction:column;gap:1px}
.blk.new{animation:pop .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.obtn{font:inherit;cursor:pointer;min-height:40px;padding:0 16px;border-radius:999px;border:0;background:#166FE5;color:#FFFFFF;font-size:14px;font-weight:600}
.obtn.go{box-shadow:0 0 0 3px #FFFFFF,0 0 0 5px #166FE5;animation:hint2 1.6s ease-in-out infinite}
@keyframes hint2{0%,100%{box-shadow:0 0 0 3px #FFFFFF,0 0 0 5px #166FE5}50%{box-shadow:0 0 0 3px #FFFFFF,0 0 0 9px rgba(22,111,229,.3)}}
.ntf{animation:msgIn .35s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.d1{animation-delay:.1s}.d2{animation-delay:.2s}.d3{animation-delay:.3s}
.mnav{display:none}
.menu-btn{list-style:none;cursor:pointer;width:44px;height:44px;border-radius:12px;border:1px solid #D5DEEB;display:grid;place-items:center;color:#0B1220;background:#FFFFFF}
.menu-btn::-webkit-details-marker{display:none}
.mnav[open] .menu-btn{border-color:#166FE5;color:#166FE5}
.mnav .i-close{display:none}.mnav[open] .i-close{display:block}.mnav[open] .i-open{display:none}
.mpanel{position:absolute;left:0;right:0;top:100%;background:#FFFFFF;border-bottom:1px solid #E8EDF5;box-shadow:0 24px 40px -24px rgba(11,18,32,.25);padding:12px 20px 20px;display:flex;flex-direction:column;gap:4px}
.mlink{display:flex;align-items:center;min-height:52px;padding:0 12px;border-radius:12px;font-size:18px;font-weight:500;color:#0B1220;border-bottom:1px solid #F1F4F9}
@media (max-width: 760px){.dnav,.dcta{display:none!important}.mnav{display:block}}
@media (max-width: 640px){.hero{padding-top:40px!important}.phone{height:640px}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

</head>
<body>

<template id="dc-template">

<div class="bl" style="background: #FFFFFF">
<header style="position: sticky; top: 0; z-index: 30; background: rgba(255,255,255,0.85); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid #E8EDF5">
<nav aria-label="Main" style="max-width: 1240px; margin: 0 auto; padding: 12px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<a href="home.html" aria-label="byteleaf home" style="display: flex; align-items: center; gap: 10px; color: #0B1220; font-weight: 700; font-size: 22px; letter-spacing: -0.04em">
<svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#1877F2"></rect><path d="M8 24C8 14 14 8 24 8C24 18 18 24 8 24Z" fill="#FFFFFF"></path><path d="M8.5 23.5L18 14M13 19h4.5M15.5 16.5v-3.5" stroke="#1877F2" stroke-width="1.8" stroke-linecap="round" fill="none"></path><circle cx="18" cy="14" r="1.6" fill="#1877F2"></circle></svg>
<span>byte<span style="color: #1877F2">leaf</span></span>

<a class="navlink" href="contact.html">Contact</a>
</div>
<a class="btn btn-primary dcta" href="book.html" style="min-height: 44px; padding: 0 20px; font-size: 15px">Book a call<svg class="arr" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>

<summary class="menu-btn" aria-label="Menu"><svg class="i-open" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg><svg class="i-close" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></summary>

</details>
</nav>
</header>


<section class="hero" style="padding: 56px 24px 32px; background: #FBFCFE; border-bottom: 1px solid #EEF2F8">
<div style="max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px">
<nav aria-label="Breadcrumb" class="mono" style="font-size: 12px; color: #4B5872"><a href="projects.html" style="color: #0F5FCC">Projects</a> / WhatsApp booking assistant</nav>
<div style="display: flex; flex-direction: column; gap: 14px; max-width: 820px">
<span class="rise mono" style="font-size: 13px; color: #0F5FCC; letter-spacing: 0.08em">SHOWCASE PROJECT 2 OF 4 · AUTOMATION</span>
<h1 class="rise d1" style="margin: 0; font-size: clamp(36px, 4.6vw, 60px); line-height: 1.02; letter-spacing: -0.04em; font-weight: 600; text-wrap: balance">Clients book in the chat. <span style="color: #1877F2">You see it in the calendar.</span></h1>
<p class="rise d2" style="margin: 0; font-size: 18px; line-height: 1.6; color: #4B5872">A short guided chat on the WhatsApp number your clients already use. Tap through it below, and watch the owner’s side change as you go.</p>
</div>
<div role="note" class="rise d3" style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; background: #FFF4E0; color: #6B3F00; font-size: 14px; line-height: 1.5">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>
<span><strong>This is a demo with sample data.</strong> Lerato’s Braids &amp; Beauty is a made-up salon. Nothing here sends a real message or books a real appointment. The phone is our own drawing of a chat app, not WhatsApp itself.</span>
</div>
</div>
</section>

<section style="padding: 32px 24px 80px">
<div style="max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px">

<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px">
<div role="tablist" aria-label="Choose a story" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{flows}}" as="f" hint-placeholder-count="3"><button type="button" role="tab" class="ftab" aria-selected="{{f.on}}" onClick="{{f.pick}}"><span class="n" aria-hidden="true">{{f.n}}</span>{{f.l}}</button></sc-for>
</div>
<div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
<span class="mono" role="status" style="font-size: 13px; color: #4B5872">{{stepLabel}}</span>
<button type="button" class="btn btn-ghost btn-sm" onClick="{{restart}}">Restart</button>
<button type="button" class="btn btn-primary btn-sm" onClick="{{next}}" disabled="{{noNext}}" style="{{nextSt}}">{{nextLabel}}</button>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start; justify-content: center">

<div style="flex: 0 1 360px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: 100%">
<div class="phone" role="region" aria-label="Client’s phone (demo)">
<div class="scr">
<div style="display: flex; justify-content: space-between; padding: 12px 22px 4px; font-size: 12px; font-weight: 600; color: #0B1220" aria-hidden="true"><span>{{clock}}</span><span class="mono" style="font-size: 10px">5G ▪▪▪</span></div>
<div style="display: flex; align-items: center; gap: 10px; padding: 8px 14px 10px; background: #FFFFFF; border-bottom: 1px solid #E3E6EB">
<span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 50%; background: #8B2F7E; color: #FFFFFF; display: grid; place-items: center; font-weight: 700; font-size: 15px">L</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Lerato’s Braids &amp; Beauty</span><span style="font-size: 11px; color: #4B5872">{{phoneSub}}</span></span>
</div>
<div data-wa-log role="log" aria-live="polite" aria-label="Chat" style="flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 8px">
<span class="mono" style="align-self: center; font-size: 10px; padding: 3px 8px; border-radius: 6px; background: #FFFFFF; color: #4B5872">{{dayLabel}}</span>
<sc-for list="{{msgs}}" as="m" hint-placeholder-count="4">
<sc-if value="{{m.isMe}}" hint-placeholder-val="{{ false }}"><div class="bub me">{{m.text}}<span class="tm">{{m.time}}</span></div></sc-if>
<sc-if value="{{m.isBot}}" hint-placeholder-val="{{ true }}">
<div class="bub {{m.cls}}">
<sc-if value="{{m.isStaff}}" hint-placeholder-val="{{ false }}"><span style="display: block; font-size: 11px; font-weight: 600; color: #7A2470; margin-bottom: 2px">Lerato · salon</span></sc-if>
<sc-if value="{{m.isTpl}}" hint-placeholder-val="{{ false }}"><span class="mono" style="display: block; font-size: 9px; letter-spacing: .06em; color: #6B7891; margin-bottom: 3px">REMINDER</span></sc-if>
<sc-for list="{{m.lines}}" as="l" hint-placeholder-count="2"><span style="display: block; min-height: 0.7em"><sc-for list="{{l}}" as="s" hint-placeholder-count="1"><span style="{{s.st}}">{{s.t}}</span></sc-for></span></sc-for>
<sc-if value="{{m.hasFoot}}" hint-placeholder-val="{{ false }}"><span style="display: block; margin-top: 5px; font-size: 12px; color: #6B7891">{{m.foot}}</span></sc-if>
<span class="tm">{{m.time}}</span>
</div>
<sc-if value="{{m.hasBtns}}" hint-placeholder-val="{{ false }}"><div class="rbs"><sc-for list="{{m.btns}}" as="b" hint-placeholder-count="3"><button type="button" class="rb {{b.cls}}" onClick="{{b.tap}}" disabled="{{b.off}}">{{b.l}}</button></sc-for></div></sc-if>
<sc-if value="{{m.hasList}}" hint-placeholder-val="{{ false }}"><div class="rbs"><button type="button" class="rb {{m.listCls}}" onClick="{{m.openList}}" disabled="{{m.listOff}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>{{m.listBtn}}</button></div></sc-if>
</sc-if>
</sc-for>
<sc-if value="{{typing}}" hint-placeholder-val="{{ false }}"><div role="status" aria-label="Typing" style="align-self: flex-start; display: flex; gap: 5px; padding: 12px 14px; border-radius: 4px 14px 14px 14px; background: #FFFFFF"><span class="dot"></span><span class="dot b"></span><span class="dot c"></span></div></sc-if>
</div>
<div style="display: flex; align-items: center; gap: 8px; padding: 8px 10px 14px; background: #ECEFF3">
<span style="flex: 1; min-height: 38px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; padding: 0 14px; font-size: 13px; color: #6B7891">Tap the options above</span>
<span aria-hidden="true" style="width: 38px; height: 38px; border-radius: 50%; background: #C9D3E3; color: #FFFFFF; display: grid; place-items: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
</div>
<sc-if value="{{sheet}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; background: rgba(11,18,32,.35); animation: msgIn .2s ease-out both" onClick="{{closeSheet}}"></div>
<div class="sheet" role="dialog" aria-modal="true" aria-label="{{sheetTitle}}">
<div style="display: flex; align-items: center; padding: 12px 8px 10px 16px"><span style="flex: 1; font-weight: 600; font-size: 15px; text-align: center; padding-left: 32px">{{sheetTitle}}</span><button type="button" onClick="{{closeSheet}}" aria-label="Close list" style="font: inherit; cursor: pointer; width: 32px; height: 32px; border: 0; border-radius: 50%; background: #F4F7FB; color: #33405A; display: grid; place-items: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
<div style="overflow-y: auto">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="5"><button type="button" class="srow {{r.cls}}" onClick="{{r.tap}}"><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px">{{r.t}}</span><span style="font-size: 12px; color: #4B5872">{{r.d}}</span></span><span class="radio" aria-hidden="true"></span></button></sc-for>
</div>
</div>
</sc-if>
</div>
</div>
<sc-if value="{{hint}}" hint-placeholder-val="{{ false }}"><p role="status" style="margin: 0; font-size: 13px; color: #4B5872; text-align: center; max-width: 320px">This demo follows one path. Tap the highlighted option.</p></sc-if>
</div>

<div style="flex: 1 1 520px; min-width: 0; max-width: 760px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 6px"><span class="mono" style="font-size: 12px; letter-spacing: 0.08em; color: #4B5872">WHAT THE OWNER SEES</span><h2 style="margin: 0; font-size: 24px; letter-spacing: -0.03em; font-weight: 600">{{ownerTitle}}</h2><p style="margin: 0; font-size: 15px; line-height: 1.55; color: #4B5872">{{ownerText}}</p></div>

<sc-if value="{{ntf}}" hint-placeholder-val="{{ false }}"><div class="ntf" role="status" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: #0B1220; color: #FFFFFF; font-size: 14px; line-height: 1.45"><span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 8px; background: #8B2F7E; display: grid; place-items: center; font-weight: 700; flex: none">L</span><span style="flex: 1">{{ntfText}}</span><span class="mono" style="font-size: 11px; color: #B7C3D9">now</span></div></sc-if>

<sc-if value="{{showCal}}" hint-placeholder-val="{{ true }}">
<div style="border: 1px solid #E3E9F2; border-radius: 18px; overflow: hidden; background: #FFFFFF; box-shadow: 0 30px 60px -40px rgba(11,18,32,.35)">
<div style="display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid #EEF2F8"><span aria-hidden="true" style="width: 24px; height: 24px; border-radius: 7px; background: #8B2F7E; color: #FFFFFF; display: grid; place-items: center; font-size: 12px; font-weight: 700">L</span><strong style="font-size: 14px">Calendar</strong><span style="font-size: 13px; color: #4B5872">{{calTitle}}</span></div>
<div style="display: flex; border-bottom: 1px solid #EEF2F8"><span style="flex: 0 0 44px"></span><sc-for list="{{calCols}}" as="c" hint-placeholder-count="3"><span style="flex: 1 1 0; min-width: 0; padding: 8px; border-left: 1px solid #EEF2F8; font-size: 12px; font-weight: 600">{{c.h}}</span></sc-for></div>
<div style="display: flex">
<div aria-hidden="true" style="flex: 0 0 44px; position: relative; height: 352px"><sc-for list="{{calHours}}" as="h" hint-placeholder-count="8"><span class="mono" style="position: absolute; right: 6px; top: {{h.y}}px; font-size: 10px; color: #4B5872">{{h.l}}</span></sc-for></div>

<script>
(function () {
  const tpl = document.getElementById('dc-template');
  const root = document.getElementById('root');
  const qp = {}; new URLSearchParams(location.search).forEach((v, k) => { qp[k] = v === 'true' ? true : v === 'false' ? false : v; }); const comp = new Component(qp);
  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  function look(scope, expr) {
    expr = expr.trim();
    if (expr === 'true') return true;
    if (expr === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(expr)) return Number(expr);
    let v = scope;
    for (const k of expr.split('.')) { if (v == null) return undefined; v = v[k]; }
    return v;
  }
  function str(v) { return v == null ? '' : String(v); }
  function walk(node, scope, out) {
    if (node.nodeType === 3) {
      out.appendChild(document.createTextNode(node.nodeValue.replace(HOLE, (m, e) => str(look(scope, e)))));
      return;
    }
    if (node.nodeType !== 1) return;
    const tag = node.tagName.toLowerCase();
    if (tag === 'sc-for') {
      const list = look(scope, node.getAttribute('list').replace(/[{}]/g, '')) || [];
      const as = node.getAttribute('as');
      list.forEach((item, i) => {
        const s = Object.assign(Object.create(scope), { [as]: item, $index: i });
        node.childNodes.forEach((c) => walk(c, s, out));
      });
      return;
    }
    if (tag === 'sc-if') {
      if (look(scope, node.getAttribute('value').replace(/[{}]/g, ''))) node.childNodes.forEach((c) => walk(c, scope, out));
      return;
    }
    const el = document.createElement(tag === 'svg' || node.namespaceURI === 'http://www.w3.org/2000/svg' ? tag : tag);
    let target = node.namespaceURI === 'http://www.w3.org/2000/svg' ? document.createElementNS('http://www.w3.org/2000/svg', node.tagName) : el;
    for (const a of node.attributes) {
      const whole = a.value.match(/^\{\{\s*([^}]+?)\s*\}\}$/);
      if (whole) {
        const v = look(scope, whole[1]);
        if (/^on[A-Z]/.test(a.name) || /^on[a-z]/.test(a.name) && typeof v === 'function') {
          if (typeof v === 'function') target.addEventListener(a.name.slice(2).toLowerCase(), v);
        } else if (typeof v === 'boolean') { if (v) target.setAttribute(a.name, ''); }
        else if (v != null) target.setAttribute(a.name, String(v));
      } else if (a.name.startsWith('hint-')) {
      } else {
        target.setAttribute(a.name, a.value.replace(HOLE, (m, e) => str(look(scope, e))));
      }
    }
    const kids = tag === 'template' ? node.content.childNodes : node.childNodes;
    kids.forEach((c) => walk(c, scope, target));
    out.appendChild(target);
  }
  window.__render = function () {
    const vals = comp.renderVals();
    const frag = document.createDocumentFragment();
    tpl.content.childNodes.forEach((c) => walk(c, vals, frag));
    root.replaceChildren(frag);
    if (window.__mounted && comp.componentDidUpdate) comp.componentDidUpdate();
    if (!window.__mounted) { window.__mounted = true; if (comp.componentDidMount) comp.componentDidMount(); }
  };
  window.__render();
})();
