<style>

<body>

<template id="dc-template">

<div class="bl" style="background: #FFFFFF; min-height: 100vh; padding: 48px 48px 56px; box-sizing: border-box">

<h1 style="margin: 0; font-size: 40px; letter-spacing: -0.04em; font-weight: 600; line-height: 1.1">Every path a client can take</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #33405A">Message IDs (B01, C06…) match the message library. Two words work at every step and are checked before anything else: <strong>PERSON</strong> pauses the assistant and flags the chat; <strong>STOP</strong> opts out. Free-form replies only go out inside the 24-hour window; everything we send first is a template.</p>
</div>
<div role="list" aria-label="Legend" style="display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; max-width: 520px">

<span role="listitem" style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px"><span style="width: 26px; height: 16px; border-radius: 5px; background: #FFFFFF; border: 1.5px solid #A9B8CF"></span>Message we send</span>
<span role="listitem" style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px"><span style="width: 26px; height: 16px; border-radius: 5px; background: #FFF8E6; border: 1.5px solid #D4A72C"></span>Check / decision</span>

<span role="listitem" style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px"><span style="width: 26px; height: 16px; border-radius: 5px; background: #FFFFFF; border: 1.5px solid #B45309"></span>Template (sent first)</span>

</header>

<div role="img" aria-label="{{alt}}" style="position: relative; width: {{W}}px; height: {{H}}px">
<sc-for list="{{bands}}" as="b" hint-placeholder-count="6">
<div style="position: absolute; left: 0; right: 0; top: {{b.y}}px; height: {{b.h}}px; border-radius: 18px; background: {{b.bg}}"></div>

</sc-for>
<svg width="{{W}}" height="{{H}}" viewBox="0 0 {{W}} {{H}}" aria-hidden="true" style="position: absolute; inset: 0; overflow: visible">
<path d="{{paths}}" fill="none" stroke="#6B7891" stroke-width="1.6" stroke-linejoin="round"></path>
<path d="{{dashed}}" fill="none" stroke="#6B7891" stroke-width="1.6" stroke-dasharray="5 4" stroke-linejoin="round"></path>

<span style="font-weight: {{n.fw}}">{{n.t}}</span>
</div>
</sc-for>
<sc-for list="{{labels}}" as="l" hint-placeholder-count="10"><span class="lbl" style="left: {{l.x}}px; top: {{l.y}}px">{{l.t}}</span></sc-for>

</div>
</section>
</div>
</template>

<script>
class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(p) { Object.assign(this.state, typeof p === 'function' ? p(this.state) : p); window.__render(); }
  forceUpdate() { window.__render(); }
}
</script>

const P = [], D = [], A = [], L = [];
const R = (n) => [n.x + n.w, n.y + n.h / 2], Lf = (n) => [n.x, n.y + n.h / 2], T = (n) => [n.x + n.w / 2, n.y], B = (n) => [n.x + n.w / 2, n.y + n.h];
const head = (x, y, dir) => { const s = 6; if (dir === 'r') A.push('M' + x + ' ' + y + 'l-' + s * 1.6 + ' -' + s + 'v' + s * 2 + 'z'); if (dir === 'l') A.push('M' + x + ' ' + y + 'l' + s * 1.6 + ' -' + s + 'v' + s * 2 + 'z'); if (dir === 'd') A.push('M' + x + ' ' + y + 'l-' + s + ' -' + s * 1.6 + 'h' + s * 2 + 'z'); if (dir === 'u') A.push('M' + x + ' ' + y + 'l-' + s + ' ' + s * 1.6 + 'h' + s * 2 + 'z'); };
const e = (a, b, mode, label, dashed) => {
const s = N[a], t = N[b]; let d, lx, ly;
const out = dashed ? D : P;
if (mode === 'h') { const p = R(s), q = Lf(t); const mx = Math.round((p[0] + q[0]) / 2); d = 'M' + p[0] + ' ' + p[1] + 'H' + mx + 'V' + q[1] + 'H' + q[0]; head(q[0], q[1], 'r'); lx = p[0] + 6; ly = p[1] - 22; if (q[1] !== p[1]) { lx = mx + 6; ly = Math.round((p[1] + q[1]) / 2) - 9; } }
else if (mode === 'v') { const p = B(s), q = T(t); const my = Math.round((p[1] + q[1]) / 2); d = 'M' + p[0] + ' ' + p[1] + 'V' + my + 'H' + q[0] + 'V' + q[1]; head(q[0], q[1], 'd'); lx = p[0] + 6; ly = p[1] + 4; }
else if (mode === 'u') { const p = T(s), q = B(t); const my = Math.round((p[1] + q[1]) / 2); d = 'M' + p[0] + ' ' + p[1] + 'V' + my + 'H' + q[0] + 'V' + q[1]; head(q[0], q[1], 'u'); lx = p[0] + 6; ly = p[1] - 22; }
else if (mode === 'lu') { const p = Lf(s), q = B(t); d = 'M' + p[0] + ' ' + p[1] + 'H' + q[0] + 'V' + q[1]; head(q[0], q[1], 'u'); lx = q[0] + 6; ly = p[1] - 22; }
else if (mode === 'ru') { const p = R(s), q = B(t); d = 'M' + p[0] + ' ' + p[1] + 'H' + q[0] + 'V' + q[1]; head(q[0], q[1], 'u'); lx = p[0] + 6; ly = p[1] - 22; }
else if (mode === 'dr') { const p = B(s), q = R(t); d = 'M' + p[0] + ' ' + p[1] + 'V' + q[1] + 'H' + q[0]; head(q[0], q[1], 'l'); lx = p[0] + 6; ly = p[1] + 6; }
else if (mode === 'dl') { const p = B(s), q = Lf(t); d = 'M' + p[0] + ' ' + p[1] + 'V' + q[1] + 'H' + q[0]; head(q[0], q[1], 'r'); lx = p[0] + 6; ly = p[1] + 6; }
out.push(d);
if (label) L.push({ t: label, x: lx, y: ly });
};
e('s0', 'kw', 'h'); e('kw', 'hr', 'h', 'no');
e('hr', 'b17', 'h', 'yes'); e('hr', 'md', 'h', 'no');
e('md', 'b16', 'h', 'yes'); e('md', 'who', 'u', 'no'); e('b17', 'who', 'h', 'Book now');
e('who', 'b01', 'h', 'new'); e('who', 'b09', 'h', 'returning');
e('b01', 'ai', 'h'); e('ai', 'b14', 'h', 'yes, clear'); e('ai', 'b15', 'h', 'unclear');
e('b14', 'b07', 'v', 'Book 08:00', true);

e('ai', 'b03', 'v', 'no, just tapped');
e('b03', 'b04', 'h'); e('b04', 'b05', 'h'); e('b05', 'nw', 'h'); e('nw', 'b06', 'h', 'yes'); e('b06', 'b07', 'h'); e('b07', 'b08', 'h', 'Confirm'); e('b08', 'cal1', 'h');
e('b04', 'b12', 'v', 'closed / past', true); e('b03', 'b11', 'v', 'nothing free in 7 days', true);
e('b07', 'b10', 'dr', 'taken', true); e('b10', 'b05', 'u', 'pick again', true);
e('t0', 'c01', 'h'); e('c01', 'c02', 'h', 'Confirm'); e('c02', 'cal2', 'h'); e('cal2', 'nr', 'h', 'if no reply');
e('cal0', 'c04', 'h', '24 h passed');
e('c01', 'c06', 'v', 'Change time');

e('pp', 'c13', 'h'); e('c13', 'ib', 'h'); e('ib', 'c14', 'h', 'Take over'); e('c14', 'c15', 'h', 'Hand back');
e('st', 'c16', 'h'); e('c16', 'c17', 'h', 'START');

};

],

{ n: 'QUESTION 1', q: 'Choosing a day: list of days, or Tomorrow / Saturday / Pick another day?', a: 'A list of the next open days (B04). It never offers a closed or full day, shows how many times are open, and is one tap. Three buttons hide the useful days behind “Pick another day”.' },

{ n: 'QUESTION 5', q: 'Demo page: live simulator or guided story? QR code?', a: 'A guided story you drive by tapping the same buttons a client would, with Next for people who just watch. The calendar fills as you go. A “Try it on your phone” card has a QR code for [demo number].' },

<script>
(function () {
  const tpl = document.getElementById('dc-template');
  const root = document.getElementById('root');
  const qp = {}; new URLSearchParams(location.search).forEach((v, k) => { qp[k] = v === 'true' ? true : v === 'false' ? false : v; }); const comp = new Component(qp);
  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  function look(scope, expr) {
    expr = expr.trim();
    if (expr === 'true') return true;
    if (expr === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(expr)) return Number(expr);
    let v = scope;
    for (const k of expr.split('.')) { if (v == null) return undefined; v = v[k]; }
    return v;
  }
  function str(v) { return v == null ? '' : String(v); }
  function walk(node, scope, out) {
    if (node.nodeType === 3) {
      out.appendChild(document.createTextNode(node.nodeValue.replace(HOLE, (m, e) => str(look(scope, e)))));
      return;
    }
    if (node.nodeType !== 1) return;
    const tag = node.tagName.toLowerCase();
    if (tag === 'sc-for') {
      const list = look(scope, node.getAttribute('list').replace(/[{}]/g, '')) || [];
      const as = node.getAttribute('as');
      list.forEach((item, i) => {
        const s = Object.assign(Object.create(scope), { [as]: item, $index: i });
        node.childNodes.forEach((c) => walk(c, s, out));
      });
      return;
    }
    if (tag === 'sc-if') {
      if (look(scope, node.getAttribute('value').replace(/[{}]/g, ''))) node.childNodes.forEach((c) => walk(c, scope, out));
      return;
    }
    const el = document.createElement(tag === 'svg' || node.namespaceURI === 'http://www.w3.org/2000/svg' ? tag : tag);
    let target = node.namespaceURI === 'http://www.w3.org/2000/svg' ? document.createElementNS('http://www.w3.org/2000/svg', node.tagName) : el;
    for (const a of node.attributes) {
      const whole = a.value.match(/^\{\{\s*([^}]+?)\s*\}\}$/);
      if (whole) {
        const v = look(scope, whole[1]);
        if (/^on[A-Z]/.test(a.name) || /^on[a-z]/.test(a.name) && typeof v === 'function') {
          if (typeof v === 'function') target.addEventListener(a.name.slice(2).toLowerCase(), v);
        } else if (typeof v === 'boolean') { if (v) target.setAttribute(a.name, ''); }
        else if (v != null) target.setAttribute(a.name, String(v));
      } else if (a.name.startsWith('hint-')) {
      } else {
        target.setAttribute(a.name, a.value.replace(HOLE, (m, e) => str(look(scope, e))));
      }
    }
    const kids = tag === 'template' ? node.content.childNodes : node.childNodes;
    kids.forEach((c) => walk(c, scope, target));
    out.appendChild(target);
  }
  window.__render = function () {
    const vals = comp.renderVals();
    const frag = document.createDocumentFragment();
    tpl.content.childNodes.forEach((c) => walk(c, vals, frag));
    root.replaceChildren(frag);
    if (window.__mounted && comp.componentDidUpdate) comp.componentDidUpdate();
    if (!window.__mounted) { window.__mounted = true; if (comp.componentDidMount) comp.componentDidMount(); }
  };
  window.__render();
})();
</script>
