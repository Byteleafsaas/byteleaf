<script>
class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(p) { Object.assign(this.state, typeof p === 'function' ? p(this.state) : p); window.__render(); }
  forceUpdate() { window.__render(); }
}
</script>
<script>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { filter: 'All' };
}
renderVals() {
const bgs = [
{ bg: 'background-color: #1877F2; background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.09) 0 2px, transparent 2px 18px);', label: 'color: #FFFFFF; border: 1px dashed rgba(255,255,255,0.7);' },
{ bg: 'background-color: #0B1220; background-image: radial-gradient(rgba(111,174,255,0.35) 1.2px, transparent 1.2px); background-size: 18px 18px;', label: 'color: #FFFFFF; border: 1px dashed rgba(255,255,255,0.6);' },
{ bg: 'background-color: #EEF4FE; background-image: linear-gradient(#D6E5FC 1px, transparent 1px), linear-gradient(90deg, #D6E5FC 1px, transparent 1px); background-size: 24px 24px;', label: 'color: #0B4FB3; border: 1px dashed #166FE5;' }
];
const projects = [
{ type: 'E-commerce storefront', cats: ['Design', 'Frontend', 'Backend'], text: '[One line on the brief and the outcome.]', tags: ['Next.js', 'Node.js'] },
{ type: 'AI document assistant', cats: ['AI', 'Backend'], text: '[One line on the brief and the outcome.]', tags: ['LLM API', 'Python'] },
{ type: 'Maintenance contract', cats: ['Backend', 'Frontend'], text: '[One line on the brief and the outcome.]', tags: ['React', 'PostgreSQL'] },
{ type: 'Customer portal redesign', cats: ['Design', 'Frontend'], text: '[One line on the brief and the outcome.]', tags: ['Figma', 'React'] },
{ type: 'Systems integration', cats: ['Backend'], text: '[One line on the brief and the outcome.]', tags: ['REST', 'Docker'] },
{ type: 'Workflow automation', cats: ['AI', 'Backend'], text: '[One line on the brief and the outcome.]', tags: ['Automation', 'Node.js'] }
].map((p, i) => Object.assign({}, p, bgs[i % 3]));
const f = this.state.filter;
const labels = ['All', 'Design', 'Frontend', 'Backend', 'AI'];
const filters = labels.map((l) => {
const on = l === f;
return {
label: l,
count: l === 'All' ? projects.length : projects.filter((p) => p.cats.indexOf(l) > -1).length,
pressed: on ? 'true' : 'false',
style: on ? 'background: #0B1220; color: #FFFFFF; border: 1px solid #0B1220;' : 'background: #FFFFFF; color: #33405A; border: 1px solid #D5DEEB;',
pick: () => this.setState({ filter: l })
};
});
return {
filters: filters,
shown: f === 'All' ? projects : projects.filter((p) => p.cats.indexOf(f) > -1)
};
}
}
</script>
<script>
(function () {
  const tpl = document.getElementById('dc-template');
  const root = document.getElementById('root');
  const qp = {}; new URLSearchParams(location.search).forEach((v, k) => { qp[k] = v === 'true' ? true : v === 'false' ? false : v; }); const comp = new Component(qp);
  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  function look(scope, expr) {
    expr = expr.trim();
    if (expr === 'true') return true;
    if (expr === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(expr)) return Number(expr);
    let v = scope;
    for (const k of expr.split('.')) { if (v == null) return undefined; v = v[k]; }
    return v;
  }
  function str(v) { return v == null ? '' : String(v); }
  function walk(node, scope, out) {
    if (node.nodeType === 3) {
      out.appendChild(document.createTextNode(node.nodeValue.replace(HOLE, (m, e) => str(look(scope, e)))));
      return;
    }
    if (node.nodeType !== 1) return;
    const tag = node.tagName.toLowerCase();
    if (tag === 'sc-for') {
      const list = look(scope, node.getAttribute('list').replace(/[{}]/g, '')) || [];
      const as = node.getAttribute('as');
      list.forEach((item, i) => {
        const s = Object.assign(Object.create(scope), { [as]: item, $index: i });
        node.childNodes.forEach((c) => walk(c, s, out));
      });
      return;
    }
    if (tag === 'sc-if') {
      if (look(scope, node.getAttribute('value').replace(/[{}]/g, ''))) node.childNodes.forEach((c) => walk(c, scope, out));
      return;
    }
    const el = document.createElement(tag === 'svg' || node.namespaceURI === 'http://www.w3.org/2000/svg' ? tag : tag);
    let target = node.namespaceURI === 'http://www.w3.org/2000/svg' ? document.createElementNS('http://www.w3.org/2000/svg', node.tagName) : el;
    for (const a of node.attributes) {
      const whole = a.value.match(/^\{\{\s*([^}]+?)\s*\}\}$/);
      if (whole) {
        const v = look(scope, whole[1]);
        if (/^on[A-Z]/.test(a.name) || /^on[a-z]/.test(a.name) && typeof v === 'function') {
          if (typeof v === 'function') target.addEventListener(a.name.slice(2).toLowerCase(), v);
        } else if (typeof v === 'boolean') { if (v) target.setAttribute(a.name, ''); }
        else if (v != null) target.setAttribute(a.name, String(v));
      } else if (a.name.startsWith('hint-')) {
      } else {
        target.setAttribute(a.name, a.value.replace(HOLE, (m, e) => str(look(scope, e))));
      }
    }
    const kids = tag === 'template' ? node.content.childNodes : node.childNodes;
    kids.forEach((c) => walk(c, scope, target));
    out.appendChild(target);
  }
  window.__render = function () {
    const vals = comp.renderVals();
    const frag = document.createDocumentFragment();
    tpl.content.childNodes.forEach((c) => walk(c, vals, frag));
    root.replaceChildren(frag);
  };
  window.__render();
})();
</script>
