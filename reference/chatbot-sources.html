<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#F4F7FB}
.bl{font-family:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;color:#0B1220;-webkit-font-smoothing:antialiased}
.mono{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
a{color:#166FE5;text-decoration:none}a:hover{color:#0B4FB3}
:focus-visible{outline:3px solid #166FE5;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.btn{font:inherit;cursor:pointer;border:0;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;font-weight:600;font-size:15px;white-space:nowrap;transition:transform .2s,box-shadow .2s,background .2s,border-color .2s,color .2s}
.btn-sm{min-height:36px;padding:0 14px;font-size:14px}
.btn-primary{background:#166FE5;color:#FFFFFF}
.btn-primary:hover:not(:disabled){background:#0F5FCC;color:#FFFFFF;box-shadow:0 10px 24px -10px rgba(22,111,229,.7)}
.btn-primary:disabled{background:#C9D3E3;color:#4B5872;cursor:not-allowed}
.btn-ghost{background:#FFFFFF;color:#0B1220;border:1px solid #D5DEEB}
.btn-ghost:hover{border-color:#166FE5;color:#166FE5}
.btn-danger{background:#FFFFFF;color:#B42318;border:1px solid #F1C9C5}
.btn-danger:hover{background:#FEF3F2}
.btn-ok{background:#0B7A55;color:#FFFFFF}
.btn-ok:hover:not(:disabled){background:#086545;color:#FFFFFF}
.btn-ok:disabled{background:#C9D3E3;color:#4B5872;cursor:not-allowed}
.search{font:inherit;font-size:15px;width:240px;max-width:100%;min-height:44px;box-sizing:border-box;padding:0 14px 0 40px;border:1px solid #E3E9F2;border-radius:12px;background:#F8FAFD;color:#0B1220;transition:border-color .2s,box-shadow .2s,background .2s}
.search:focus{outline:none;border-color:#166FE5;background:#FFFFFF;box-shadow:0 0 0 4px rgba(24,119,242,.15)}
.search::placeholder{color:#6B7891}
.field{font:inherit;font-size:15px;color:#0B1220;width:100%;box-sizing:border-box;min-height:46px;padding:11px 14px;border:1px solid #D5DEEB;border-radius:12px;background:#FFFFFF;transition:border-color .2s,box-shadow .2s}
.field:hover{border-color:#A9B8CF}
.field:focus{outline:none;border-color:#166FE5;box-shadow:0 0 0 4px rgba(24,119,242,.15)}
.field::placeholder{color:#6B7891}
.lbl{font-size:14px;font-weight:500;color:#33405A}
.hint{font-size:13px;color:#4B5872}
.snav{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:12px;color:#B7C3D9;font-size:15px;font-weight:500;white-space:nowrap;transition:background .2s,color .2s}
.snav:hover{background:#101E3A;color:#FFFFFF}
.snav.on{background:#166FE5;color:#FFFFFF}
.snav.off{opacity:.55;cursor:default}.snav.off:hover{background:transparent;color:#B7C3D9}
.panel{background:#FFFFFF;border:1px solid #E3E9F2;border-radius:18px}
.tab{font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:500;white-space:nowrap;transition:all .2s}
.row{transition:background .15s}.row:hover{background:#F8FAFD}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;padding:4px 9px;border-radius:999px;white-space:nowrap}
.ibtn{font:inherit;cursor:pointer;width:40px;height:40px;border-radius:10px;border:1px solid transparent;background:transparent;color:#4B5872;display:grid;place-items:center;transition:all .15s}
.ibtn:hover{border-color:#D5DEEB;background:#FFFFFF;color:#166FE5}
.sw{font:inherit;cursor:pointer;position:relative;flex:none;width:44px;height:26px;border-radius:999px;border:0;padding:0;transition:background .2s}
.sw .knob{position:absolute;top:3px;width:20px;height:20px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(11,18,32,.3);transition:left .2s}
.ai{display:inline-flex;align-items:center;gap:5px;font-family:'Geist Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.06em;padding:3px 7px;border-radius:6px;background:#F1ECFE;color:#5B21B6}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.d1{animation-delay:.06s}.d2{animation-delay:.12s}.d3{animation-delay:.18s}
@keyframes slide{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.slide{animation:slide .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes toast{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.toast{animation:toast .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.scrim{animation:fadein .2s ease both}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.modal{animation:pop .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes bar{from{background-position:0 0}to{background-position:40px 0}}
.prog{background-image:linear-gradient(45deg,rgba(255,255,255,.25) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.25) 50%,rgba(255,255,255,.25) 75%,transparent 75%);background-size:20px 20px;animation:bar 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(24,119,242,.5)}100%{box-shadow:0 0 0 8px rgba(24,119,242,0)}}
.pulse{animation:pulse 1.8s ease-out infinite}
.dot{width:7px;height:7px;border-radius:50%;background:#4B5872;animation:dot 1.2s infinite ease-in-out}
.dot.b{animation-delay:.15s}.dot.c{animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.caret{display:inline-block;width:2px;height:16px;background:#166FE5;vertical-align:-3px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (max-width: 900px){.side{flex:1 1 100%!important;min-width:0;max-width:100%;flex-direction:row!important;flex-wrap:wrap!important;align-items:center!important;gap:10px!important;padding:12px 16px!important}.snavs{flex-direction:row!important;overflow-x:auto;width:100%;min-width:0;position:relative}.sfoot,.wscard{display:none!important}.pad{padding-left:16px!important;padding-right:16px!important}}
@media (max-width: 760px){.hide-sm{display:none!important}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.route{transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s,border-color .3s}
.route:hover{transform:translateY(-4px);box-shadow:0 24px 40px -28px rgba(11,18,32,.35);border-color:#B9D2F8}
</style>

</head>
<body>
<div id="root"></div>
<template id="dc-template">

<div class="bl" style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #F4F7FB">
<aside class="side" style="flex: 0 0 264px; background: #07101F; color: #FFFFFF; display: flex; flex-direction: column; gap: 22px; padding: 22px 16px; box-sizing: border-box">

<svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#1877F2"></rect><path d="M8 24C8 14 14 8 24 8C24 18 18 24 8 24Z" fill="#FFFFFF"></path><path d="M8.5 23.5L18 14M13 19h4.5M15.5 16.5v-3.5" stroke="#1877F2" stroke-width="1.8" stroke-linecap="round" fill="none"></path><circle cx="18" cy="14" r="1.6" fill="#1877F2"></circle></svg>
<span>byteleaf</span>
<span class="mono" style="font-size: 10px; font-weight: 500; letter-spacing: 0.08em; color: #6FAEFF; border: 1px solid #2C5BA8; border-radius: 6px; padding: 2px 6px">ADMIN</span>
</a>
<div class="wscard" style="display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 14px; background: #0B1730; border: 1px solid #1C2B47">
<span class="mono" style="font-size: 10px; letter-spacing: 0.08em; color: #8A98B3">KNOWLEDGE ASSISTANT</span>
<button type="button" style="font: inherit; cursor: pointer; display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 10px; border-radius: 10px; border: 1px solid #22345A; background: #07101F; color: #FFFFFF; text-align: left">
<span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 50%; background: #E8A317; display: grid; place-items: center; flex: none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2"></path></svg></span>
<span style="flex: 1; display: flex; flex-direction: column; min-width: 0"><span style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Khumalo Home Solar</span><span style="font-size: 11px; color: #8A98B3">Demo client · switch</span></span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A98B3" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"></path></svg>
</button>
</div>
<nav aria-label="Assistant admin" class="snavs" style="display: flex; flex-direction: column; gap: 4px">
<a class="snav on" href="chatbot-sources.html" aria-current="page"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3zM4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"></path></svg><span style="flex: 1">Knowledge sources</span></a>
<a class="snav" href="chatbot-review.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"></path></svg><span style="flex: 1">Review &amp; publish</span><span class="mono" style="min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: #1877F2; color: #FFFFFF; font-size: 11px; display: grid; place-items: center; box-sizing: border-box">9<span class="sr"> to do</span></span></a>
<a class="snav" href="chatbot-test.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.6A8 8 0 1 1 21 12z"></path></svg><span style="flex: 1">Test assistant</span></a>
<a class="snav" href="chatbot-unanswered.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"></path></svg><span style="flex: 1">Unanswered</span><span class="mono" style="min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: #1877F2; color: #FFFFFF; font-size: 11px; display: grid; place-items: center; box-sizing: border-box">4<span class="sr"> to do</span></span></a>
<a class="snav" href="chatbot-conversations.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg><span style="flex: 1">Conversations</span></a>
<a class="snav" href="chatbot-settings.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg><span style="flex: 1">Assistant settings</span></a>
</nav>
<div class="sfoot" style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
<a class="snav" href="admin-dashboard.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg>byteleaf admin</a>
<div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; background: #0B1730; border: 1px solid #1C2B47">
<span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 50%; background: #1877F2; display: grid; place-items: center; font-weight: 600; flex: none">G</span>
<span style="flex: 1; display: flex; flex-direction: column; min-width: 0"><span style="font-size: 14px; font-weight: 600">Gerald</span><span style="font-size: 12px; color: #8A98B3">Administrator</span></span>
<a href="admin-login.html" aria-label="Sign out" style="color: #B7C3D9; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg></a>
</div>
</div>
</aside>
<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
<header class="pad" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 32px; background: #FFFFFF; border-bottom: 1px solid #E3E9F2">
<div style="display: flex; flex-direction: column; gap: 2px">
<span class="mono" style="font-size: 12px; color: #4B5872">Khumalo Home Solar / Knowledge</span>
<h1 style="margin: 0; font-size: 26px; letter-spacing: -0.03em; font-weight: 600">Knowledge sources</h1>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<sc-if value="{{notEmpty}}" hint-placeholder-val="{{ true }}"><div style="position: relative"><label for="q" class="sr">Search sources</label><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4B5872" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 14px; top: 13px"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><input id="q" class="search" type="search" placeholder="Search sources…" onInput="{{onSearch}}"></div></sc-if>
<a class="btn btn-primary" href="chatbot-add-source.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add a source</a>
</div>
</header>

<div class="pad" style="padding: 24px 32px 48px; display: flex; flex-direction: column; gap: 20px; box-sizing: border-box; width: 100%; max-width: 1320px">

<sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}">
<section class="panel rise" aria-labelledby="empty-h" style="padding: clamp(28px, 5vw, 56px); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 18px">
<span aria-hidden="true" style="width: 72px; height: 72px; border-radius: 22px; background: #EEF4FE; color: #166FE5; display: grid; place-items: center"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3zM4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"></path></svg></span>
<h2 id="empty-h" style="margin: 0; font-size: 26px; letter-spacing: -0.03em; font-weight: 600">Your assistant doesn't know anything yet</h2>
<p style="margin: 0; max-width: 520px; font-size: 16px; line-height: 1.6; color: #4B5872">Give it the information you already have. AI tidies it into short, clear items, and nothing goes live until you've checked it.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 16px; width: 100%; max-width: 860px; padding-top: 8px">
<sc-for list="{{routes}}" as="r" hint-placeholder-count="3">
<a class="route" href="chatbot-add-source.html" style="display: flex; flex-direction: column; gap: 10px; align-items: flex-start; text-align: left; padding: 20px; border-radius: 16px; border: 1px solid #E3E9F2; background: #FFFFFF; color: #0B1220">
<span style="width: 44px; height: 44px; border-radius: 12px; background: #EEF4FE; color: #166FE5; display: grid; place-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"></path></svg></span>
<span style="font-size: 16px; font-weight: 600">{{r.t}}</span><span style="font-size: 14px; line-height: 1.5; color: #4B5872">{{r.d}}</span>
</a>
</sc-for>
</div>
<span class="hint">Tip: start with your website. Most businesses have their prices and services there already.</span>
</section>
</sc-if>

<sc-if value="{{notEmpty}}" hint-placeholder-val="{{ true }}">
<div role="status" class="rise" style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 14px 18px; border-radius: 14px; background: #FFF4E0; color: #6B3F00">
<span class="ai" style="background: #FFFFFF">AI CLEANED</span>
<span style="flex: 1 1 280px; font-size: 15px; line-height: 1.5"><strong>9 items are waiting for your approval</strong>, including 1 price that conflicts with your website. Nothing changes for customers until you publish.</span>
<a class="btn btn-sm" href="chatbot-review.html" style="background: #6B3F00; color: #FFFFFF">Review now</a>
</div>

<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px">
<div role="tablist" aria-label="Filter by status" style="display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; background: #FFFFFF; border: 1px solid #E3E9F2; border-radius: 999px; max-width: 100%; box-sizing: border-box">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<button type="button" role="tab" class="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}<span class="mono" style="font-size: 11px; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; display: grid; place-items: center; box-sizing: border-box; {{t.cs}}">{{t.count}}</span></button>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 10px"><label for="ty" style="font-size: 14px; color: #4B5872">Type</label><select id="ty" onChange="{{onType}}" style="font: inherit; font-size: 14px; min-height: 40px; padding: 0 12px; border: 1px solid #D5DEEB; border-radius: 10px; background: #FFFFFF; color: #0B1220"><option>All types</option><option>File</option><option>Typed</option><option>Web page</option></select></div>
</div>

<section class="panel rise d1" aria-label="Sources" style="overflow: hidden">
<div class="mono hide-sm" style="display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid #EEF2F8; background: #FBFCFE; font-size: 11px; letter-spacing: 0.06em; color: #4B5872">
<span style="flex: 1 1 280px">SOURCE</span><span style="width: 150px">STATUS</span><span style="width: 70px; text-align: right">ITEMS</span><span style="width: 110px">UPDATED</span><span style="width: 180px; text-align: right">ACTIONS</span>
</div>
<ul style="list-style: none; margin: 0; padding: 0">
<sc-for list="{{rows}}" as="s" hint-placeholder-count="8">
<li class="row" style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 14px 20px; border-bottom: 1px solid #EEF2F8">
<div style="flex: 1 1 280px; min-width: 0; display: flex; align-items: center; gap: 14px">
<span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 12px; background: {{s.ibg}}; color: {{s.ic}}; display: grid; place-items: center; flex: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{s.icon}}"></path></svg></span>
<span style="min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 15px; font-weight: 600">{{s.name}}<sc-if value="{{s.staff}}" hint-placeholder-val="{{ false }}"><span class="pill" style="background: #EEF2F8; color: #33405A; padding: 2px 7px">STAFF ONLY</span></sc-if></span>
<span style="font-size: 13px; color: #4B5872; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{s.typeLabel}}</span>
</span>
</div>
<div style="width: 150px; display: flex; flex-direction: column; gap: 6px">
<span class="pill" style="align-self: flex-start; {{s.badge}}"><sc-if value="{{s.busy}}" hint-placeholder-val="{{ false }}"><svg class="spin" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.2-8.6"></path></svg></sc-if>{{s.status}}</span>

</span>
<sc-if value="{{s.problem}}" hint-placeholder-val="{{ false }}"><div style="flex: 1 1 100%; display: flex; gap: 10px; align-items: flex-start; margin-left: 54px; padding: 10px 12px; border-radius: 10px; background: {{s.pbg}}; color: {{s.pc}}; font-size: 13px; line-height: 1.5"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex: none; margin-top: 2px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg><span><strong>{{s.ptitle}}</strong> {{s.problem}}</span></div></sc-if>
</li>
</sc-for>
</ul>
<sc-if value="{{noRows}}" hint-placeholder-val="{{ false }}"><div style="padding: 40px 20px; text-align: center; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 16px; font-weight: 600">No sources match</span><span class="hint">Try another status or type, or clear the search.</span></div></sc-if>
</section>
<span class="hint">The assistant only uses items that are <strong>Live</strong>. Staff-only sources are never shown to customers.</span>
</sc-if>
</div>
</main>

<script>
class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(p) { Object.assign(this.state, typeof p === 'function' ? p(this.state) : p); window.__render(); }
  forceUpdate() { window.__render(); }
}
</script>
<script>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { tab: 'all', q: '', type: 'All types' }; }
renderVals() {
const st = this.state;
const WEB = 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18';
const FILE = 'M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8zM14 3v5h5';
const TYPED = 'M4 6h16M4 12h10M4 18h7';
const ST = {
live: ['Live', 'background: #E6F6EF; color: #0B6B4B;'],
review: ['Needs review', 'background: #FFF4E0; color: #8A5200;'],
partly: ['Partly reviewed', 'background: #FFF4E0; color: #8A5200;'],
busy: ['Processing', 'background: #EEF4FE; color: #0B4FB3;'],
failed: ['Failed', 'background: #FEF3F2; color: #912018;'],
nothing: ['Nothing found', 'background: #EEF2F8; color: #33405A;']
};
const D = [
{ name: 'Services and packages', kind: 'Web page', typeLabel: 'Web page · khumalosolar.example/services', st: 'live', items: 18, updated: '2 Nov' },
{ name: 'Price list 2026.pdf', kind: 'File', typeLabel: 'File · PDF · 2 pages', st: 'review', items: 14, updated: 'Today, 09:12', problem: 'The Family package is R 112 000 here but R 118 500 on your website. Choose one when you review.', ptitle: '1 conflict.', pbg: '#FFF4E0', pc: '#6B3F00' },
{ name: 'Finance FAQ', kind: 'Typed', typeLabel: 'Typed by Gerald', st: 'partly', items: 7, updated: 'Yesterday', partly: '3 of 7 approved' },
{ name: 'FAQ page', kind: 'Web page', typeLabel: 'Web page · khumalosolar.example/faq · cleaning 31 of 48 items', st: 'busy', items: '—', updated: 'Just now', pct: 64 },
{ name: 'Warranty terms.pdf', kind: 'File', typeLabel: 'File · PDF · 6 pages', st: 'live', items: 22, updated: '28 Oct' },
{ name: 'About Khumalo Home Solar', kind: 'Typed', typeLabel: 'Typed by Gerald', st: 'live', items: 5, updated: '20 Oct' },
{ name: 'Install procedure v3.docx', kind: 'File', typeLabel: 'File · Word document · 9 pages', st: 'live', items: 12, updated: '15 Oct', staff: true },
{ name: 'Old brochure 2023.pdf', kind: 'File', typeLabel: 'File · PDF · 4 pages', st: 'failed', items: 0, updated: '14 Oct', ptitle: "Couldn't read this file.", problem: 'It is a scanned image with no text in it. Upload a text PDF, or open it and paste the text instead.', pbg: '#FEF3F2', pc: '#8A1C12', retry: 'Replace' },
{ name: 'Blog', kind: 'Web page', typeLabel: 'Web page · khumalosolar.example/blog · 3 pages scanned', st: 'nothing', items: 0, updated: '12 Oct', ptitle: 'Nothing useful found.', problem: 'These pages are news posts with no prices, services or policies. Try your services page instead, or add the information as text.', pbg: '#F4F7FB', pc: '#33405A', retry: 'Try another page' }
];
const groups = { all: () => true, live: (d) => d.st === 'live', review: (d) => d.st === 'review' || d.st === 'partly', busy: (d) => d.st === 'busy', failed: (d) => d.st === 'failed' || d.st === 'nothing' };
const q = st.q.trim().toLowerCase();
const rows = D.filter(groups[st.tab]).filter((d) => st.type === 'All types' || d.kind === st.type).filter((d) => !q || d.name.toLowerCase().indexOf(q) > -1);
const empty = this.props.empty ?? false;
return {
isEmpty: empty, notEmpty: !empty,
routes: [
{ t: 'Upload files', d: 'PDF, Word or text files: price lists, brochures, policies.', icon: 'M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3' },
{ t: 'Type or paste', d: 'Quick facts like opening hours, areas you serve, or answers to common questions.', icon: TYPED },
{ t: 'Add your website', d: 'Paste a web address and we read the pages for you.', icon: WEB }
],
onSearch: (e) => this.setState({ q: e.target.value }),
onType: (e) => this.setState({ type: e.target.value }),
tabs: [['all', 'All'], ['live', 'Live'], ['review', 'Needs review'], ['busy', 'Processing'], ['failed', 'Problems']].map((l) => {
const on = st.tab === l[0];
return { label: l[1], count: String(D.filter(groups[l[0]]).length), sel: on ? 'true' : 'false', style: on ? 'border: 0; background: #0B1220; color: #FFFFFF;' : 'border: 0; background: transparent; color: #4B5872;', cs: on ? 'background: rgba(255,255,255,0.18); color: #FFFFFF;' : 'background: #EEF2F8; color: #33405A;', pick: () => this.setState({ tab: l[0] }) };
}),
rows: rows.map((d) => Object.assign({}, d, {
icon: d.kind === 'Web page' ? WEB : d.kind === 'Typed' ? TYPED : FILE,
ibg: d.kind === 'Web page' ? '#EEF4FE' : d.kind === 'Typed' ? '#F1ECFE' : '#F4F7FB', ic: d.kind === 'Web page' ? '#166FE5' : d.kind === 'Typed' ? '#5B21B6' : '#33405A',
status: d.st === 'partly' ? d.partly : ST[d.st][0], badge: ST[d.st][1], busy: d.st === 'busy',
items: String(d.items), reviewBtn: d.st === 'review' || d.st === 'partly', retryBtn: d.retry || '', problem: d.problem || ''
})),
noRows: rows.length === 0
};
}
}
</script>
<script>
(function () {
  const tpl = document.getElementById('dc-template');
  const root = document.getElementById('root');
  const qp = {}; new URLSearchParams(location.search).forEach((v, k) => { qp[k] = v === 'true' ? true : v === 'false' ? false : v; }); const comp = new Component(qp);
  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  function look(scope, expr) {
    expr = expr.trim();
    if (expr === 'true') return true;
    if (expr === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(expr)) return Number(expr);
    let v = scope;
    for (const k of expr.split('.')) { if (v == null) return undefined; v = v[k]; }
    return v;
  }
  function str(v) { return v == null ? '' : String(v); }
  function walk(node, scope, out) {
    if (node.nodeType === 3) {
      out.appendChild(document.createTextNode(node.nodeValue.replace(HOLE, (m, e) => str(look(scope, e)))));
      return;
    }
    if (node.nodeType !== 1) return;
    const tag = node.tagName.toLowerCase();
    if (tag === 'sc-for') {
      const list = look(scope, node.getAttribute('list').replace(/[{}]/g, '')) || [];
      const as = node.getAttribute('as');
      list.forEach((item, i) => {
        const s = Object.assign(Object.create(scope), { [as]: item, $index: i });
        node.childNodes.forEach((c) => walk(c, s, out));
      });
      return;
    }
    if (tag === 'sc-if') {
      if (look(scope, node.getAttribute('value').replace(/[{}]/g, ''))) node.childNodes.forEach((c) => walk(c, scope, out));
      return;
    }
    const el = document.createElement(tag === 'svg' || node.namespaceURI === 'http://www.w3.org/2000/svg' ? tag : tag);
    let target = node.namespaceURI === 'http://www.w3.org/2000/svg' ? document.createElementNS('http://www.w3.org/2000/svg', node.tagName) : el;
    for (const a of node.attributes) {
      const whole = a.value.match(/^\{\{\s*([^}]+?)\s*\}\}$/);
      if (whole) {
        const v = look(scope, whole[1]);
        if (/^on[A-Z]/.test(a.name) || /^on[a-z]/.test(a.name) && typeof v === 'function') {
          if (typeof v === 'function') target.addEventListener(a.name.slice(2).toLowerCase(), v);
        } else if (typeof v === 'boolean') { if (v) target.setAttribute(a.name, ''); }
        else if (v != null) target.setAttribute(a.name, String(v));
      } else if (a.name.startsWith('hint-')) {
      } else {
        target.setAttribute(a.name, a.value.replace(HOLE, (m, e) => str(look(scope, e))));
      }
    }
    const kids = tag === 'template' ? node.content.childNodes : node.childNodes;
    kids.forEach((c) => walk(c, scope, target));
    out.appendChild(target);
  }
  window.__render = function () {
    const vals = comp.renderVals();
    const frag = document.createDocumentFragment();
    tpl.content.childNodes.forEach((c) => walk(c, vals, frag));
    root.replaceChildren(frag);
    if (window.__mounted && comp.componentDidUpdate) comp.componentDidUpdate();
    if (!window.__mounted) { window.__mounted = true; if (comp.componentDidMount) comp.componentDidMount(); }
  };
  window.__render();
})();
</script>
