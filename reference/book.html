<script>
class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(p) { Object.assign(this.state, typeof p === 'function' ? p(this.state) : p); window.__render(); }
  forceUpdate() { window.__render(); }
}
</script>
<script>
class Component extends DCLogic {
constructor(props) {
super(props);
const now = new Date();
const firstOpen = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
while (firstOpen.getDay() === 0 || firstOpen.getDay() === 6) firstOpen.setDate(firstOpen.getDate() + 1);
this.state = { type: 0, y: firstOpen.getFullYear(), m: firstOpen.getMonth(), day: null, time: null, done: false };
}
renderVals() {
const st = this.state;
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const types = [
{ name: 'Discovery call', text: 'Tell us about your business and what you need. No prep required.', meta: '30 min · Free · Video call', where: 'Video call' },
{ name: 'Technical deep-dive', text: 'Walk us through an existing system, codebase or problem in detail.', meta: '60 min · Video call', where: 'Video call' },
{ name: 'In-person meeting', text: 'Meet the team at your office or ours in Johannesburg.', meta: '60 min · Johannesburg', where: 'Johannesburg' }
];
const now = new Date();
const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
const first = new Date(st.y, st.m, 1);
const offset = (first.getDay() + 6) % 7;
const daysIn = new Date(st.y, st.m + 1, 0).getDate();
const cells = [];
for (let i = 0; i < offset; i++) cells.push({ label: '', disabled: true, aria: 'Empty', pressed: 'false', style: 'border: 0; background: transparent;', pick: () => {} });
for (let d = 1; d <= daysIn; d++) {
const date = new Date(st.y, st.m, d);
const wd = date.getDay();
const off = wd === 0 || wd === 6 || date <= today;
const sel = st.day && st.day.getTime() === date.getTime();
cells.push({
label: String(d),
disabled: off,
aria: DAYS[wd] + ' ' + d + ' ' + MONTHS[st.m],
pressed: sel ? 'true' : 'false',
style: sel ? 'border: 1px solid #166FE5; background: #166FE5; color: #FFFFFF; box-shadow: 0 10px 20px -10px rgba(22,111,229,0.8);' : off ? 'border: 1px solid transparent; background: transparent; color: #A9B4C6;' : 'border: 1px solid #D6E5FC; background: #EEF4FE; color: #0B4FB3;',
pick: () => { if (!off) this.setState({ day: date, time: null }); }
});
}
const slotTimes = ['09:00', '10:00', '11:30', '13:00', '14:30', '16:00'];
const t = types[st.type];
const dateLabel = st.day ? DAYS[st.day.getDay()] + ' ' + st.day.getDate() + ' ' + MONTHS[st.day.getMonth()] : '—';
const atStart = st.y < now.getFullYear() || (st.y === now.getFullYear() && st.m <= now.getMonth());
const shift = (n) => { const d = new Date(st.y, st.m + n, 1); this.setState({ y: d.getFullYear(), m: d.getMonth() }); };
return {
done: st.done,
notDone: !st.done,
types: types.map((x, i) => {
const on = i === st.type;
return Object.assign({}, x, {
pressed: on ? 'true' : 'false',
style: on ? 'border: 1.5px solid #166FE5; background: #F3F8FF; color: #0B1220;' : 'border: 1.5px solid #E3E9F2; background: #FFFFFF; color: #0B1220;',
radio: on ? 'border: 6px solid #166FE5; background: #FFFFFF;' : 'border: 2px solid #A9B8CF; background: #FFFFFF;',
pick: () => this.setState({ type: i })
});
}),
typeName: t.name,
where: t.where,
dateLabel: dateLabel,
time: st.time,
timeLabel: st.time ? st.time + ' SAST' : '—',
monthLabel: MONTHS[st.m] + ' ' + st.y,
atStart: atStart,
prev: () => { if (!atStart) shift(-1); },
next: () => shift(1),
cells: cells,
hasDay: !!st.day,
noDay: !st.day,
slots: slotTimes.map((s) => {
const on = s === st.time;
return {
t: s,
pressed: on ? 'true' : 'false',
style: on ? 'border: 1px solid #166FE5; background: #166FE5; color: #FFFFFF;' : 'border: 1px solid #D5DEEB; background: #FFFFFF; color: #0B1220;',
pick: () => this.setState({ time: s })
};
}),
cantBook: !(st.day && st.time),
hint: st.day && st.time ? 'Looks good — just add your details.' : 'Choose a date and time to continue.',
submit: (e) => { if (e && e.preventDefault) e.preventDefault(); if (st.day && st.time) this.setState({ done: true }); },
restart: () => this.setState({ done: false, day: null, time: null })
};
}
}
</script>
<script>
(function () {
  const tpl = document.getElementById('dc-template');
  const root = document.getElementById('root');
  const qp = {}; new URLSearchParams(location.search).forEach((v, k) => { qp[k] = v === 'true' ? true : v === 'false' ? false : v; }); const comp = new Component(qp);
  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  function look(scope, expr) {
    expr = expr.trim();
    if (expr === 'true') return true;
    if (expr === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(expr)) return Number(expr);
    let v = scope;
    for (const k of expr.split('.')) { if (v == null) return undefined; v = v[k]; }
    return v;
  }
  function str(v) { return v == null ? '' : String(v); }
  function walk(node, scope, out) {
    if (node.nodeType === 3) {
      out.appendChild(document.createTextNode(node.nodeValue.replace(HOLE, (m, e) => str(look(scope, e)))));
      return;
    }
    if (node.nodeType !== 1) return;
    const tag = node.tagName.toLowerCase();
    if (tag === 'sc-for') {
      const list = look(scope, node.getAttribute('list').replace(/[{}]/g, '')) || [];
      const as = node.getAttribute('as');
      list.forEach((item, i) => {
        const s = Object.assign(Object.create(scope), { [as]: item, $index: i });
        node.childNodes.forEach((c) => walk(c, s, out));
      });
      return;
    }
    if (tag === 'sc-if') {
      if (look(scope, node.getAttribute('value').replace(/[{}]/g, ''))) node.childNodes.forEach((c) => walk(c, scope, out));
      return;
    }
    const el = document.createElement(tag === 'svg' || node.namespaceURI === 'http://www.w3.org/2000/svg' ? tag : tag);
    let target = node.namespaceURI === 'http://www.w3.org/2000/svg' ? document.createElementNS('http://www.w3.org/2000/svg', node.tagName) : el;
    for (const a of node.attributes) {
      const whole = a.value.match(/^\{\{\s*([^}]+?)\s*\}\}$/);
      if (whole) {
        const v = look(scope, whole[1]);
        if (/^on[A-Z]/.test(a.name) || /^on[a-z]/.test(a.name) && typeof v === 'function') {
          if (typeof v === 'function') target.addEventListener(a.name.slice(2).toLowerCase(), v);
        } else if (typeof v === 'boolean') { if (v) target.setAttribute(a.name, ''); }
        else if (v != null) target.setAttribute(a.name, String(v));
      } else if (a.name.startsWith('hint-')) {
      } else {
        target.setAttribute(a.name, a.value.replace(HOLE, (m, e) => str(look(scope, e))));
      }
    }
    const kids = tag === 'template' ? node.content.childNodes : node.childNodes;
    kids.forEach((c) => walk(c, scope, target));
    out.appendChild(target);
  }
  window.__render = function () {
    const vals = comp.renderVals();
    const frag = document.createDocumentFragment();
    tpl.content.childNodes.forEach((c) => walk(c, vals, frag));
    root.replaceChildren(frag);
  };
  window.__render();
})();
</script>
