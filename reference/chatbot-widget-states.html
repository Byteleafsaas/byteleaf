<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge chatbot — widget states</title>
<!-- REFERENCE BUILD generated from design/CbWidgetStates.dc.html. Not production code. -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#F4F7FB}
.mono{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.dot{width:7px;height:7px;border-radius:50%;background:#4B5872;animation:dot 1.2s infinite ease-in-out}
.dot.b{animation-delay:.15s}.dot.c{animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.caret{display:inline-block;width:2px;height:16px;background:#166FE5;vertical-align:-3px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@keyframes cd{from{width:100%}to{width:0}}
.cd{animation:cd 30s linear infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>

</head>
<body>
<div id="root"></div>
<template id="dc-template">

<div style="width: 1720px; height: 3800px; box-sizing: border-box; padding: 56px 40px; background: #F4F7FB; font-family: 'Geist', system-ui, sans-serif; color: #0B1220; display: flex; flex-direction: column; gap: 40px">
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span class="mono" style="font-size: 13px; color: #166FE5; letter-spacing: 0.08em">KNOWLEDGE CHATBOT · WIDGET STATES</span>
<h1 style="margin: 0; font-size: 44px; letter-spacing: -0.035em; font-weight: 600">Every state of the chat widget</h1>
</div>
<span style="font-size: 15px; color: #4B5872; max-width: 520px; text-align: right">Shown at 380 × 600 in the byteleaf theme. On phones the same panel fills the screen. Placeholders stay in [brackets].</span>
</div>
<div style="display: grid; grid-template-columns: repeat(4, 380px); gap: 48px 40px">
<sc-for list="{{states}}" as="s" hint-placeholder-count="18">
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: baseline; gap: 10px"><span class="mono" style="font-size: 12px; color: #166FE5">{{s.n}}</span><span style="font-size: 16px; font-weight: 600">{{s.title}}</span></div>

<sc-if value="{{s.isLauncher}}" hint-placeholder-val="{{ false }}">
<div style="position: relative; width: 380px; height: 600px; border-radius: 20px; background: #F4F1EA; border: 1px dashed #D5DEEB; overflow: hidden">
<span class="mono" style="position: absolute; top: 16px; left: 16px; font-size: 11px; color: #8A6A10">CLIENT WEBSITE</span>
<sc-if value="{{s.nudge}}" hint-placeholder-val="{{ false }}"><div style="position: absolute; right: 20px; bottom: 92px; max-width: 230px; padding: 12px 14px; border-radius: 14px 14px 4px 14px; background: #FFFFFF; border: 1px solid #E3E9F2; box-shadow: 0 18px 40px -20px rgba(0,0,0,0.4); font-size: 14px; line-height: 1.45"><span style="display: block; font-weight: 600">Questions about going solar?</span>Ask me about packages, prices and warranty.</div></sc-if>
<span style="position: absolute; right: 20px; bottom: 20px; width: 60px; height: 60px; border-radius: 50%; background: #166FE5; color: #FFFFFF; display: grid; place-items: center; box-shadow: 0 14px 30px -10px rgba(0,0,0,0.4)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.6A8 8 0 1 1 21 12z"></path><path d="M8.5 11h.01M12 11h.01M15.5 11h.01"></path></svg>
<sc-if value="{{s.nudge}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; top: 2px; right: 2px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; background: #D92D20; color: #FFFFFF; border: 2px solid #FFFFFF; font-size: 11px; font-weight: 700; display: grid; place-items: center">1</span></sc-if></span>
</div>
</sc-if>

<sc-if value="{{s.isPanel}}" hint-placeholder-val="{{ true }}">
<div style="width: 380px; height: 600px; box-sizing: border-box; border-radius: 20px; background: #FFFFFF; border: 1px solid #E3E9F2; box-shadow: 0 30px 60px -36px rgba(11,18,32,0.45); display: flex; flex-direction: column; overflow: hidden; position: relative">
<div style="display: flex; align-items: center; gap: 12px; padding: 14px 12px 14px 16px; border-bottom: 1px solid #E3E9F2">
<span style="width: 38px; height: 38px; border-radius: 50%; background: #166FE5; color: #FFFFFF; display: grid; place-items: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Khumalo assistant</span><span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #4B5872"><span class="mono" style="font-size: 10px; padding: 2px 6px; border-radius: 6px; background: #EEF4FE; color: #0B1220">AI</span>Answers from Khumalo's own info</span></span>
<span style="width: 32px; height: 32px; display: grid; place-items: center; color: #4B5872"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></span>
</div>

<sc-if value="{{s.isChat}}" hint-placeholder-val="{{ true }}">
<div style="flex: 1; overflow: hidden; padding: 14px; display: flex; flex-direction: column; gap: 12px; justify-content: flex-end">
<sc-for list="{{s.items}}" as="i" hint-placeholder-count="3">
<sc-if value="{{i.bot}}" hint-placeholder-val="{{ false }}"><div style="align-self: flex-start; max-width: 88%; padding: 11px 13px; border-radius: 4px 16px 16px 16px; background: #F2F5F9; font-size: 14px; line-height: 1.5">{{i.bot}}<sc-if value="{{i.caret}}" hint-placeholder-val="{{ false }}"><span class="caret"></span></sc-if></div></sc-if>
<sc-if value="{{i.long}}" hint-placeholder-val="{{ false }}"><div style="align-self: flex-start; max-width: 88%; display: flex; flex-direction: column; gap: 6px"><div style="position: relative; max-height: 168px; overflow: hidden; padding: 11px 13px; border-radius: 4px 16px 16px 16px; background: #F2F5F9; font-size: 14px; line-height: 1.5">{{i.long}}<span style="position: absolute; left: 0; right: 0; bottom: 0; height: 48px; background: linear-gradient(rgba(242,245,249,0), #F2F5F9)"></span></div><span style="font-size: 13px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px">Show full answer</span></div></sc-if>
<sc-if value="{{i.list}}" hint-placeholder-val="{{ false }}"><div style="align-self: flex-start; max-width: 88%; padding: 11px 13px; border-radius: 4px 16px 16px 16px; background: #F2F5F9; font-size: 14px; line-height: 1.5; display: flex; flex-direction: column; gap: 6px"><span>{{i.listIntro}}</span><ul style="margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px"><sc-for list="{{i.list}}" as="li" hint-placeholder-count="3"><li>{{li}}</li></sc-for></ul><sc-if value="{{i.link}}" hint-placeholder-val="{{ false }}"><span style="font-weight: 600; text-decoration: underline; text-underline-offset: 3px">{{i.link}} ↗</span></sc-if></div></sc-if>
<sc-if value="{{i.user}}" hint-placeholder-val="{{ false }}"><div style="align-self: flex-end; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; max-width: 82%"><div style="padding: 9px 13px; border-radius: 16px 4px 16px 16px; background: {{i.userBg}}; color: #FFFFFF; font-size: 14px; line-height: 1.5">{{i.user}}</div><sc-if value="{{i.failed}}" hint-placeholder-val="{{ false }}"><span style="display: flex; align-items: center; gap: 4px; font-size: 12px; color: #B42318"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>Not sent</span></sc-if></div></sc-if>
<sc-if value="{{i.typing}}" hint-placeholder-val="{{ false }}"><div style="align-self: flex-start; padding: 13px 15px; border-radius: 4px 16px 16px 16px; background: #F2F5F9; display: flex; gap: 5px"><span class="dot"></span><span class="dot b"></span><span class="dot c"></span></div></sc-if>
<sc-if value="{{i.meta}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: -4px">
<sc-for list="{{i.src}}" as="sc" hint-placeholder-count="1"><span style="display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 2px 10px; border-radius: 999px; border: 1px solid {{sc.bd}}; color: {{sc.c}}; font-size: 12px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8zM14 3v5h5"></path></svg>{{sc.t}}</span></sc-for>
<sc-if value="{{i.nosrc}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; color: #4B5872">{{i.nosrc}}</span></sc-if>
<sc-if value="{{i.rate}}" hint-placeholder-val="{{ false }}"><span style="margin-left: auto; display: flex; gap: 10px; color: #4B5872">
<svg width="16" height="16" viewBox="0 0 24 24" fill="{{i.upF}}" stroke="{{i.upS}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v11H4V10zM7 10l4-7a2 2 0 0 1 3 2l-1 5h6a2 2 0 0 1 2 2.3l-1.4 7A2 2 0 0 1 17.6 21H7"></path></svg>
<svg width="16" height="16" viewBox="0 0 24 24" fill="{{i.dnF}}" stroke="{{i.dnS}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 14V3h3v11zM17 14l-4 7a2 2 0 0 1-3-2l1-5H5a2 2 0 0 1-2-2.3l1.4-7A2 2 0 0 1 6.4 3H17"></path></svg></span></sc-if>
</div>
</sc-if>
<sc-if value="{{i.snip}}" hint-placeholder-val="{{ false }}"><div style="padding: 9px 11px; border-radius: 10px; border: 1px solid #E3E9F2; font-size: 12px; line-height: 1.5; color: #4B5872"><span class="mono" style="display: block; font-size: 10px; margin-bottom: 3px">FROM: {{i.snipFrom}}</span>“{{i.snip}}”</div></sc-if>
<sc-if value="{{i.btn}}" hint-placeholder-val="{{ false }}"><span style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #D5DEEB; font-size: 13px; font-weight: 600; margin-top: -4px">{{i.btn}}</span></sc-if>
<sc-if value="{{i.chips}}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-direction: {{i.chipDir}}; flex-wrap: wrap; gap: 6px; align-items: flex-start"><sc-if value="{{i.chipsLabel}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; color: #4B5872; width: 100%">{{i.chipsLabel}}</span></sc-if><sc-for list="{{i.chips}}" as="c" hint-placeholder-count="3"><span style="display: inline-flex; align-items: center; min-height: 34px; padding: 4px 12px; border-radius: 999px; border: 1px solid {{i.chipBd}}; background: {{i.chipBg}}; font-size: 13px">{{c}}</span></sc-for></div></sc-if>
<sc-if value="{{i.thanks}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; color: #4B5872">{{i.thanks}}</span></sc-if>
<sc-if value="{{i.banner}}" hint-placeholder-val="{{ false }}"><div role="alert" style="display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; background: {{i.bannerBg}}; color: {{i.bannerC}}; font-size: 13px; line-height: 1.45"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg><span style="flex: 1">{{i.banner}}</span><sc-if value="{{i.retry}}" hint-placeholder-val="{{ false }}"><span style="font-weight: 600; text-decoration: underline">Retry</span></sc-if></div></sc-if>
</sc-for>
</div>
<div style="padding: 10px 12px; border-top: 1px solid #E3E9F2; display: flex; flex-direction: column; gap: 6px">
<sc-if value="{{s.cooldown}}" hint-placeholder-val="{{ false }}"><div style="height: 3px; border-radius: 3px; background: #EEF2F8; overflow: hidden"><div class="cd" style="height: 100%; background: #166FE5"></div></div></sc-if>
<div style="display: flex; gap: 8px; align-items: center"><span style="flex: 1; min-height: 42px; display: flex; align-items: center; padding: 0 14px; border-radius: 999px; border: 1px solid #E3E9F2; font-size: 14px; color: {{s.inputC}}; background: {{s.inputBg}}">{{s.inputText}}</span><span style="width: 42px; height: 42px; border-radius: 50%; background: {{s.sendBg}}; color: #FFFFFF; display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span></div>
<div style="display: flex; justify-content: space-between; font-size: 11px; color: #4B5872"><span>AI assistant · <span style="text-decoration: underline">Privacy</span></span><span style="text-decoration: underline">Talk to a person</span></div>
</div>
</sc-if>

<sc-if value="{{s.isForm}}" hint-placeholder-val="{{ false }}">
<div style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 19px; font-weight: 600">Ask the team</span>
<span style="font-size: 13px; line-height: 1.5; color: #4B5872">This is a separate form, not the chat. A person at Khumalo Home Solar will reply, usually within [X business hours].</span>
<sc-for list="{{s.fields}}" as="f" hint-placeholder-count="3"><span style="display: flex; flex-direction: column; gap: 5px"><span style="font-size: 12px; font-weight: 500">{{f.l}}</span><span style="min-height: {{f.h}}; box-sizing: border-box; padding: 10px 12px; border-radius: 10px; border: 1px solid #D5DEEB; font-size: 14px; color: {{f.c}}">{{f.v}}</span></span></sc-for>
<span style="display: flex; gap: 8px; font-size: 12px; line-height: 1.45; color: #4B5872"><span style="width: 16px; height: 16px; border-radius: 4px; background: #166FE5; flex: none; margin-top: 1px"></span>I agree that Khumalo Home Solar may contact me about this question. <span style="text-decoration: underline; color: #0B1220">Privacy note</span></span>
<span style="display: flex; gap: 8px; margin-top: auto"><span style="min-height: 42px; padding: 0 14px; border-radius: 999px; border: 1px solid #D5DEEB; display: flex; align-items: center; font-size: 14px; font-weight: 600">Back to chat</span><span style="flex: 1; min-height: 42px; border-radius: 999px; background: #166FE5; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600">Send to the team</span></span>
</div>
</sc-if>
<sc-if value="{{s.isSent}}" hint-placeholder-val="{{ false }}">
<div style="flex: 1; padding: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center">
<span style="width: 60px; height: 60px; border-radius: 50%; background: #166FE5; color: #FFFFFF; display: grid; place-items: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"></path></svg></span>
<span style="font-size: 19px; font-weight: 600">Sent to the team</span>
<span style="font-size: 13px; line-height: 1.5; color: #4B5872; max-width: 260px">A person will get back to you, usually within [X business hours].</span>
<span style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid #D5DEEB; display: flex; align-items: center; font-size: 14px; font-weight: 600">Back to chat</span>
</div>
</sc-if>
</div>
</sc-if>
<span style="font-size: 13px; line-height: 1.5; color: #4B5872">{{s.note}}</span>
</div>
</sc-for>
</div>
</div>
</template>

<script>
class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(p) { Object.assign(this.state, typeof p === 'function' ? p(this.state) : p); window.__render(); }
  forceUpdate() { window.__render(); }
}
</script>
<script>
class Component extends DCLogic {
renderVals() {
const GREET = "Hi, I'm the Khumalo Home Solar assistant. I can help with packages, prices, installation and warranty. What would you like to know?";
const BAT_Q = 'Do you install batteries as well as panels?';
const BAT_A = 'Yes. We install panels, inverters and batteries, and we can add a battery to a system you already have. Most home installs take one to two days. Would you like a quote?';
const src = (names, on) => names.map((t, i) => ({ t: t, bd: on === i ? '#166FE5' : '#E3E9F2', c: on === i ? '#0B1220' : '#4B5872' }));
const rate = (u, d) => ({ rate: true, upF: u ? '#166FE5' : 'none', upS: u ? '#166FE5' : '#4B5872', dnF: d ? '#166FE5' : 'none', dnS: d ? '#166FE5' : '#4B5872' });
const meta = (o) => Object.assign({ meta: true, src: [], nosrc: '' }, o);
const U = (t, failed) => ({ user: t, userBg: failed ? '#7FA9E6' : '#166FE5', failed: !!failed });
const base = { isPanel: true, isChat: true, isLauncher: false, isForm: false, isSent: false, cooldown: false, inputText: 'Ask about packages, prices, warranty…', inputC: '#4B5872', inputBg: '#FFFFFF', sendBg: '#166FE5' };
const S = (n, title, o, note) => Object.assign({}, base, { n: n, title: title, note: note || '', items: [] }, o);
return {
states: [
S('01', 'Closed launcher', { isPanel: false, isLauncher: true, nudge: false }, '60px round button, bottom-right, 24px from the edges (16px on phones). Label: "Open chat with the Khumalo assistant".'),
S('02', 'Launcher with unread nudge', { isPanel: false, isLauncher: true, nudge: true }, 'Shown once per visit after 6 seconds. The badge counts 1 unread greeting. Dismissed on open.'),
S('03', 'First open', { items: [{ bot: GREET }, { chips: ['Do you install batteries as well as panels?', 'How much does a home system cost?', 'What warranty do I get?', 'Can I pay it off monthly?'], chipsLabel: 'Popular questions', chipDir: 'column', chipBd: '#E3E9F2', chipBg: '#FFFFFF' }] }, 'Greeting plus 4 suggested questions, set by the owner in Settings.'),
S('04', 'Typing indicator', { items: [{ bot: GREET }, U(BAT_Q), { typing: true }] }, 'Three dots, 1.2s loop, each 0.15s apart. Announced as "Assistant is typing".'),
S('05', 'Answer streaming in', { items: [{ bot: GREET }, U(BAT_Q), { bot: 'Yes. We install panels, inverters and batteries, and we can add a battery to a sys', caret: true }], inputText: 'Ask about packages, prices, warranty…' }, 'Text appears a few characters at a time with a blinking 2px caret. Sources and feedback appear once it finishes.'),
S('06', 'Answer with one source', { items: [U(BAT_Q), { bot: BAT_A }, meta(Object.assign({ src: src(['Services and packages'], 0) }, rate(false, false))), { snip: 'We supply and install solar panels, hybrid inverters and lithium batteries, and retrofit batteries to existing systems.', snipFrom: 'Services and packages' }] }, 'Sources are quiet chips under the answer. Tapping one shows the exact passage used.'),
S('07', 'Answer with several sources', { items: [U('How much does a home system cost?'), { bot: 'Our Essential package (3 kW panels, 5 kWh battery) is R 68 500, and the Family package (5 kW, 10 kWh) is R 112 000. Both include installation and the electrical certificate.' }, meta(Object.assign({ src: src(['Price list 2026', 'Services and packages']) }, rate(false, false)))] }, 'Up to 3 chips; more collapse into "+2 more".'),
S('08', 'Answer with no source', { items: [U('Thanks, that helps!'), { bot: "You're welcome. Anything else you'd like to know about going solar?" }, meta({ nosrc: 'General reply · no source needed' })] }, 'Small talk only. Any factual answer must have a source; if none is found the assistant says it does not know (09).'),
S('09', "I don't know + ask the team", { items: [U('Do you do solar for caravans?'), { bot: "I'm not sure about that, and I don't want to guess. I can pass your question to the team." }, { btn: 'Ask the team' }, meta({ nosrc: 'No source found' })] }, 'Logged to Unanswered questions for the owner.'),
S('10', 'Outside allowed topics', { items: [U('Can you help with my tax return?'), { bot: "That's outside what I can help with. I can answer questions about Khumalo's solar packages, prices, installation and warranty." }, { chips: ['Solar packages and prices', 'Installation', 'Warranty'], chipDir: 'row', chipBd: '#E3E9F2', chipBg: '#FFFFFF' }] }, 'Refused topics are set in Settings. Offers 3 on-topic shortcuts.'),
S('11', 'Long answer', { items: [U('How does installation work?'), { long: 'Installation happens in four steps. First we visit for a free site assessment to check your roof, your electrical board and how much power you use. Within 48 hours you get a written quote. Once you accept, we book the install — most homes take one to two days, and you will be without power for about four hours on the final day while we connect everything. Finally we test the system, hand over your certificate of compliance and show you the app.' }, meta(Object.assign({ src: src(['Installation process']) }, rate(false, false)))] }, 'Answers over 6 lines collapse with a fade and "Show full answer". Most answers stay under 60 words.'),
S('12', 'List answer with a link', { items: [U('What warranty do I get?'), { list: ['Panels: 25-year performance', 'Inverter: 10 years', 'Battery: 10 years', 'Our workmanship: 5 years'], listIntro: 'Every install comes with four warranties:', link: 'Full warranty terms' }, meta(Object.assign({ src: src(['Warranty terms']) }, rate(false, false)))] }, 'Lists use real <ul>. Links open in a new tab and say so to screen readers.'),
S('13', 'Network error and retry', { items: [{ bot: GREET }, U('Can I pay it off monthly?', true), { banner: "Couldn't send. Check your connection and try again.", bannerBg: '#FEF3F2', bannerC: '#8A1C12', retry: true }] }, 'The unsent message stays in place, faded, with "Not sent". Retry resends it. Announced with role="alert".'),
S('14', 'Too many messages, please wait', { items: [U('price?'), { bot: 'Our Essential package is R 68 500 and the Family package is R 112 000.' }, U('price??'), { banner: "You've sent a lot of messages in a short time. Please wait 30 seconds, then try again.", bannerBg: '#FFF4E0', bannerC: '#7A4A00' }], cooldown: true, inputText: 'Please wait 30 seconds…', inputC: '#6B7891', inputBg: '#F4F7FB', sendBg: '#C9D3E3' }, 'Input and send are disabled. A thin bar counts down the wait.'),

<script>
(function () {
  const tpl = document.getElementById('dc-template');
  const root = document.getElementById('root');
  const qp = {}; new URLSearchParams(location.search).forEach((v, k) => { qp[k] = v === 'true' ? true : v === 'false' ? false : v; }); const comp = new Component(qp);
  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  function look(scope, expr) {
    expr = expr.trim();
    if (expr === 'true') return true;
    if (expr === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(expr)) return Number(expr);
    let v = scope;
    for (const k of expr.split('.')) { if (v == null) return undefined; v = v[k]; }

    if (node.nodeType === 3) {
      out.appendChild(document.createTextNode(node.nodeValue.replace(HOLE, (m, e) => str(look(scope, e)))));
      return;
    }
    if (node.nodeType !== 1) return;
    const tag = node.tagName.toLowerCase();
    if (tag === 'sc-for') {
      const list = look(scope, node.getAttribute('list').replace(/[{}]/g, '')) || [];

        const s = Object.assign(Object.create(scope), { [as]: item, $index: i });
        node.childNodes.forEach((c) => walk(c, s, out));

      if (look(scope, node.getAttribute('value').replace(/[{}]/g, ''))) node.childNodes.forEach((c) => walk(c, scope, out));
      return;
    }
    const el = document.createElement(tag === 'svg' || node.namespaceURI === 'http://www.w3.org/2000/svg' ? tag : tag);
    let target = node.namespaceURI === 'http://www.w3.org/2000/svg' ? document.createElementNS('http://www.w3.org/2000/svg', node.tagName) : el;
    for (const a of node.attributes) {
      const whole = a.value.match(/^\{\{\s*([^}]+?)\s*\}\}$/);
      if (whole) {
        const v = look(scope, whole[1]);
        if (/^on[A-Z]/.test(a.name) || /^on[a-z]/.test(a.name) && typeof v === 'function') {
          if (typeof v === 'function') target.addEventListener(a.name.slice(2).toLowerCase(), v);
        } else if (typeof v === 'boolean') { if (v) target.setAttribute(a.name, ''); }
        else if (v != null) target.setAttribute(a.name, String(v));
      } else if (a.name.startsWith('hint-')) {
      } else {
        target.setAttribute(a.name, a.value.replace(HOLE, (m, e) => str(look(scope, e))));
      }
    }
    const kids = tag === 'template' ? node.content.childNodes : node.childNodes;
    kids.forEach((c) => walk(c, scope, target));
